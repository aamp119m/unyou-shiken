<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>各種運用試験筆記問題対策</title><meta name="theme-color" content="#3157d5"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="default"><meta name="apple-mobile-web-app-title" content="運用試験対策"><link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-192.png"><style>
:root{--bg:#f5f7fb;--card:#fff;--ink:#162033;--muted:#738096;--accent:#3157d5;--good:#17834b;--bad:#d33b3b;--line:#e5e9f2}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans JP",sans-serif;background:var(--bg);color:var(--ink)}.app{max-width:720px;margin:auto;min-height:100vh;padding:20px 16px 90px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.brand{font-weight:900;font-size:22px}.pill{font-size:12px;background:#e9edff;color:#2948b8;padding:6px 10px;border-radius:999px}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px;box-shadow:0 8px 24px #1e2b4a0d;margin-bottom:14px}h1{font-size:25px;margin:4px 0 8px}h2{font-size:18px;margin:0 0 12px}.sub{color:var(--muted);line-height:1.6}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.exam{padding:18px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:18px;font:inherit}.exam b{display:block;font-size:16px;margin-top:8px}.exam span{font-size:12px;color:var(--muted)}button{cursor:pointer}.primary,.secondary,.choice,.ox{width:100%;border:0;border-radius:15px;padding:15px;font-weight:800;font-size:16px}.primary{background:var(--accent);color:white}.secondary{background:#eef1f7;color:#34405a}.mode{display:grid;gap:10px}.mode button{text-align:left}.row{display:flex;gap:10px}.row>*{flex:1}.hidden{display:none!important}.qmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;margin-bottom:12px}.question{font-size:21px;line-height:1.75;font-weight:700;min-height:150px;display:flex;align-items:center}.oxwrap{display:grid;grid-template-columns:1fr 1fr;gap:12px}.ox{font-size:28px}.yes{background:#e7f7ee;color:var(--good)}.no{background:#fdeaea;color:var(--bad)}.choices{display:grid;gap:10px}.choice{text-align:left;background:#f2f4f8;color:var(--ink);border:2px solid transparent}.choice.correct{background:#e6f6ed;border-color:#8bd0aa}.choice.wrong{background:#fdeaea;border-color:#efaaaa}.result{margin-top:14px;padding:15px;border-radius:15px;background:#f7f8fb}.result strong{font-size:18px}.master{margin-top:10px;line-height:1.7}.hl{background:#fff0a6;padding:1px 3px;border-radius:4px;font-weight:900}.progress{height:8px;background:#e7eaf0;border-radius:99px;overflow:hidden;margin:8px 0 16px}.bar{height:100%;background:var(--accent);width:0}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center}.stat{background:#f6f7fa;border-radius:14px;padding:12px 5px}.stat b{display:block;font-size:20px}.tiny{font-size:11px;color:var(--muted)}.back{border:0;background:none;color:var(--accent);font-weight:800;padding:4px 0 12px}.resume{background:#fff8dc;border-color:#f0dc86}.footerNote{font-size:12px;color:var(--muted);text-align:center;margin-top:20px}@media(max-width:430px){.question{font-size:19px}.grid{grid-template-columns:1fr}.app{padding-top:14px}}
</style></head><body><div class="app"><div class="top"><div class="brand">各種運用試験筆記問題対策</div><div class="pill">v4.2</div></div>
<section id="home"><div class="card"><h1>試験を選択</h1><div class="sub">全問題をシャッフルして、1周するまで重複なし。途中で閉じても続きから再開できます。</div></div><div id="examGrid" class="grid"></div></section>
<section id="setup" class="hidden"><button class="back" onclick="goHome()">← 試験選択へ</button><div class="card"><h1 id="setupTitle"></h1><div class="sub" id="setupCount"></div></div><div id="resumeCard" class="card resume hidden"><h2>続きがあります</h2><div class="sub" id="resumeText"></div><div class="row" style="margin-top:12px"><button class="primary" onclick="resumeSession()">続きから</button><button class="secondary" onclick="clearSession()">最初から</button></div></div><div class="card"><h2>出題モード</h2><div class="mode"><button class="primary" onclick="startSession('mix')">🔀 MIX（○×＋4択穴埋め）</button><button class="secondary" onclick="startSession('ox')">⭕❌ ○×</button><button class="secondary" onclick="startSession('blank')">🔲 4択穴埋め</button></div></div><div class="card"><h2>出題数</h2><div class="row"><button class="secondary countBtn" data-n="10">10問</button><button class="secondary countBtn" data-n="30">30問</button><button class="secondary countBtn" data-n="50">50問</button><button class="secondary countBtn" data-n="all">全問</button></div><div class="tiny" style="margin-top:10px">※ 全問を選ぶと、その試験の全正文を1回ずつ出題します。</div></div></section>
<section id="quiz" class="hidden"><button class="back" onclick="quitQuiz()">← メニューへ</button><div class="card"><div class="qmeta"><span id="modeLabel"></span><span id="counter"></span></div><div class="progress"><div id="bar" class="bar"></div></div><div id="question" class="question"></div><div id="oxWrap" class="oxwrap"><button class="ox yes" onclick="answerOX(true)">○</button><button class="ox no" onclick="answerOX(false)">×</button></div><div id="choices" class="choices hidden"></div><div id="result" class="result hidden"></div><button id="nextBtn" class="primary hidden" style="margin-top:14px" onclick="nextQuestion()">次の問題 →</button></div><div class="stats"><div class="stat"><b id="sCorrect">0</b><span class="tiny">正解</span></div><div class="stat"><b id="sWrong">0</b><span class="tiny">不正解</span></div><div class="stat"><b id="sRate">—</b><span class="tiny">正答率</span></div></div></section>
<section id="finish" class="hidden"><div class="card"><h1>1セット完了！ 🎉</h1><div class="sub" id="finishText"></div><div class="stats" style="margin-top:18px"><div class="stat"><b id="fCorrect"></b><span class="tiny">正解</span></div><div class="stat"><b id="fWrong"></b><span class="tiny">不正解</span></div><div class="stat"><b id="fRate"></b><span class="tiny">正答率</span></div></div></div><button class="primary" onclick="restartSame()">もう一度シャッフル</button><button class="secondary" style="margin-top:10px" onclick="goHome()">試験選択へ</button></section><div class="footerNote">元の正文は変更せず保存し、出題時のみ加工しています。</div></div>
<script>const DB={"drug":{"name":"薬剤試験","icon":"💊","items":[{"no":1,"text":"医療者の基本的な行動規範である生命倫理４原則には、「自律の尊重、善行の原則、無危害の原則、公正・正義の原則」がある。"},{"no":2,"text":"患者の権利とは、良質な医療を受ける権利、選択の自由についての権利、自己決定の権利、情報を得る権利などである。"},{"no":3,"text":"成人男性の血漿は体重の約５％に相当する。"},{"no":4,"text":"成人男性の間質液は体重の約１５％に相当する。"},{"no":5,"text":"成人男性の細胞内液と細胞外液は、それぞれ体重の約40％と約20％である。"},{"no":6,"text":"乳酸リンゲル液、生理食塩液、５％糖液は、体液にほぼ等しい浸透圧を有し、等張液と呼ばれる。"},{"no":7,"text":"筋肉内注射の部位は上腕の三角筋や大腿部前外側がよく用いられる。"},{"no":8,"text":"リンパ系の主要な機能は、リンパの還流と腸管からの栄養素の運搬である。"},{"no":9,"text":"シナプスでは、神経伝達物質（アドレナリン、ノルアドレナリン、ドパミン、アセチルコリンなど）を介して信号が伝達される。"},{"no":10,"text":"交感神経は、胸髄から腰髄にいたる脊髄の前根から起始している。"},{"no":11,"text":"交感神経の神経終末における神経伝達物質は一般にノルアドレナリンである。"},{"no":12,"text":"動眼神経、顔面神経、舌咽神経および迷走神経は脳幹に起始する副交感神経機能を持つ。"},{"no":13,"text":"副交感神経の神経終末における神経伝達物質は一般にアセチルコリンである。"},{"no":14,"text":"心臓壁は心膜（外層）、心筋（中層）、心内膜（内層）の３層から構成されている。"},{"no":15,"text":"心臓を包む心膜には、外層の繊維性心膜と、内層の漿膜性心膜がある。"},{"no":16,"text":"心膜のうち、線維性心膜は強靭な膜で、下方は横隔膜の腱中心に、左右両側は縦隔胸膜、後方は食道や胸（部）大動脈に接している。"},{"no":17,"text":"心膜腔には、少量の漿液（心嚢液）が存在しており、滑りやすいので心臓は滑らかに拍動する。"},{"no":18,"text":"右心室は全身から戻った静脈血をガス交換のために肺動脈を介して肺へ、左心室では大動脈を介して全身へ酸素化された血液を送り出す。"},{"no":19,"text":"左心室の発生する圧力は、右心室の６～７倍である。"},{"no":20,"text":"右心房は全身からの静脈血を受け、右心室へ血液を送り出す部屋である。"},{"no":21,"text":"洞結節は通常、心臓の収縮のリズムを決めるので、心臓のペースメーカーと呼ばれる。"},{"no":22,"text":"洞結節は上大静脈の右心房への開口部の前壁側にある。"},{"no":23,"text":"ヒス束は房室結節からはじまる。"},{"no":24,"text":"心拍数が増加して心周期が短くなっても収縮期はあまり短縮されず、主に拡張期の短縮が起こる。"},{"no":25,"text":"心音のⅠ音は、房室弁の閉鎖音が主成分で、収縮期のはじめに聴取される。"},{"no":26,"text":"心音のⅡ音は、半月弁の閉鎖音が主成分であり、駆出期の終わりに聴取される。"},{"no":27,"text":"心音のⅠ音とそれにひき続くⅡ音の間が収縮期である。"},{"no":28,"text":"冠動脈への血流は、心拍出量の約1/20の血液が供給されている。"},{"no":29,"text":"左右の冠動脈は上行大動脈起始部から最初の枝として分枝する。"},{"no":30,"text":"左心室壁の冠血流は収縮期には少なく、大部分は拡張期に発生する。"},{"no":31,"text":"心室の前負荷は、収縮前に心室に存在する血液量である。"},{"no":32,"text":"後負荷は、末梢血管抵抗、大動脈弁狭窄、血液粘稠度、動脈の弾性、心室容積などで規定される。"},{"no":33,"text":"１回拍出量は、前負荷、心収縮力、後負荷の３つの因子で決まる。"},{"no":34,"text":"１回拍出量は、前負荷と心収縮力が大きく後負荷が小さいほど増加する。"},{"no":35,"text":"心拍出量の規定因子は前負荷、後負荷、心収縮力、心拍数の４つである。"},{"no":36,"text":"血管壁の中膜は、かなり厚い中間層で、平滑筋と弾性組織でできており、平滑筋は交感神経系の支配を受けている。"},{"no":37,"text":"静脈の壁は薄く伸展しやすく、血液を大量に溜めることができる。"},{"no":38,"text":"全血液量の約60～70％は常に静脈に存在している。"},{"no":39,"text":"静脈は、低い圧で重力に抗して血液を心臓に戻すため、太い静脈には弁が付いており、血液が逆流するのを防いでいる。"},{"no":40,"text":"循環の三要素は心臓（心収縮力）、血管（末梢血管抵抗）、血液（循環血液量）である。"},{"no":41,"text":"平均血圧は心拍出量と全末梢血管抵抗の積で表される。"},{"no":42,"text":"頸動脈小体や大動脈小体は、血中O2低下やCO2上昇、pH 低下などによって興奮し、呼吸中枢を活性化させるとともに、血管運動中枢にも伝わり血管収縮と心拍数の増加を起こす。"},{"no":43,"text":"アンギオテンシンⅡは、心収縮力を高め、細動脈を収縮させることで血圧を上昇させる。"},{"no":44,"text":"バソプレシンは、脳下垂体後葉から分泌される抗利尿ホルモンで、脱水やショックなどのように循環血漿量が減少したとき（血漿浸透圧が上昇したとき）に体液を保持するよう働く。"},{"no":45,"text":"バソプレシンは、薬物として投与された際には血中濃度は生理学的な量よりはるかに高く、その際には強力な血管収縮作用をもつ。"},{"no":46,"text":"α１受容体は血管平滑筋に分布する。"},{"no":47,"text":"アドレナリンは副腎髄質から分泌されるホルモンである。"},{"no":48,"text":"アドレナリンは、心機能促進作用と末梢血管収縮の作用を併せもつ。また血糖値を上昇させる作用も有している。"},{"no":49,"text":"カリウムは細胞内の主要な陽イオンである。"},{"no":50,"text":"細胞外液の減少に伴い、浸透圧上昇や血圧低下などをきたすと、脳下垂体から抗利尿ホルモンが分泌され腎臓における水の再吸収を増加させて体内に水分を保持する。"},{"no":51,"text":"細胞外液の減少に伴い、浸透圧上昇や血圧低下などをきたすと、腎臓からレニンが分泌されてレニンｰアンギオテンシンｰアルドステロン系が活性化されてナトリウムの再吸収と水分を保持する。"},{"no":52,"text":"細胞外液のpH は、肺による換気量の増減により調節が行われ、それとともに酸の排泄，炭酸水素イオンの再吸収など腎臓の働きにより調整される"},{"no":53,"text":"浸透圧とは、濃度の薄いほうから濃いほうへ水が移動する力のことをいう。"},{"no":54,"text":"感染してから発症するまでの期間を潜伏期という。潜伏期の感染は症状が明らかになっていないという意味で不顕性感染と呼ばれ、発症した後は顕性感染と呼ぶ。"},{"no":55,"text":"病原性とは、宿主に感染症を起こす性質をいい、病原性の程度には、感染性因子、病原性因子、毒性因子の３つが大きく関与する。"},{"no":56,"text":"病原体となる微生物には、ウイルス、細菌、真菌、寄生虫などがある。"},{"no":57,"text":"ウイルスの本体はRNA（リボ核酸）かDNA（デオキシリボ核酸）で、ウイルスは細胞に感染することでRNA もしくはDNA を細胞に送り込みウイルスの複製を行う。"},{"no":58,"text":"細菌は、自己増殖できる最小の単細胞の原核生物である。"},{"no":59,"text":"感染の主な要因は、感染源（病原体）、感染経路、宿主である。"},{"no":60,"text":"空気感染（飛沫核感染）は、飛沫が気化し，直径５μm 以下の飛沫核となって空中を浮遊し、それから感染するもの。浮遊は長時間にわたり、感染源から離れた場所でも感染する危険がある。"},{"no":61,"text":"空気感染の代表疾病として結核、麻疹、水痘などがある。"},{"no":62,"text":"アドレナリンは昇圧薬であるが、アドレナリン注0.1％Ⓡシリンジは昇圧剤である。"},{"no":63,"text":"「医薬品、医療機器等の品質、有効性及び安全性の確保等に関する法律」は、医薬品、医薬部外品、化粧品、再生医療製品を定める法律であり、医療機器や医療ソフトウェアに関することも定められている。"},{"no":64,"text":"薬理作用がきわめて強い薬剤や体内に吸収されたときの有効域と中毒域が接近しているような薬剤が、薬機法により劇薬もしくは毒薬として指定されている。"},{"no":65,"text":"毒薬のほうが劇薬より作用が強い。"},{"no":66,"text":"医薬品は、当該製品に原則として、効能・効果、用法・用量、使用上の注意（警告、禁忌、慎重投与、副作用など）を記載した文書が添付されている。"},{"no":67,"text":"毒薬は黒地に白枠、白字で、その品名と「毒」の文字が記載されている。"},{"no":68,"text":"劇薬は白地に赤枠、赤字で、その品名と「劇」の文字が記載されている。"},{"no":69,"text":"注射剤にはアンプル型（管）やバイアル型（瓶）のほか、シリンジにあらかじめ収められたプレフィルドシリンジがある。"},{"no":70,"text":"錠剤やカプセル剤は多くの場合、個々の薬剤がPTPと呼ばれる包装シートに封入されている。"},{"no":71,"text":"薬物の用量は、添付文書に記載されている。"},{"no":72,"text":"毒薬または劇薬を取り扱うものは、他のものと区別して貯蔵、陳列する。"},{"no":73,"text":"毒薬については施錠して保管することが規定されている。"},{"no":74,"text":"薬剤救命士が使用するアドレナリンの添付文書の一番初めの項は「禁忌」である。"},{"no":75,"text":"アドレナリンは無色澄明の液である。"},{"no":76,"text":"アドレナリンは空気又は光によって徐々に微赤色となり、次に褐色となる。"},{"no":77,"text":"アドレナリンはｐＨ２．３～５．０である。"},{"no":78,"text":"アドレナリンは遮光・室温保存で管理する。"},{"no":79,"text":"薬物の体内動態は４ つの過程に分けられ、 吸収、分布、代謝、排泄の４つの一連の過程を薬物動態という。"},{"no":80,"text":"投与された薬物が、血行を介して臓器や組織へ移行することを分布という。"},{"no":81,"text":"薬の最高血中濃度(Cmax)の半分の濃度に減少するまでに要する時間は消失半減期(T1/2)と呼ばれ、薬物の代謝・排泄の速さの指標になる。"},{"no":82,"text":"薬物の血中濃度は、無効濃度、有効濃度、中毒濃度、致死的濃度の４段階に分類される。"},{"no":83,"text":"ED50（effective dose 50 、 50% 有効量）とは対象の50%に効果をもたらす量のことである。"},{"no":84,"text":"LD50（50％致死量）/ED50（50％有効量）を治療指数もしくは安全域といい、この値が大きいほど安全性が高い薬物である。"},{"no":85,"text":"治療指数は安全係数と言い換えられ、安全係数が大きい薬物を普通薬、小さいものを毒薬、その中間のものを劇薬と呼ぶ。"},{"no":86,"text":"経口投与は、消化管における吸収・代謝、肝臓における代謝・排泄を経て血中に入るため、薬理作用の発現に時間がかかり、かつ多くの薬用量を要する。"},{"no":87,"text":"経口摂取された薬物が、門脈を介し肝臓に達した際に代謝・分解を受けることを初回通過効果という。"},{"no":88,"text":"薬物の一部は尿細管で再吸収され、循環血中に戻る。"},{"no":89,"text":"直腸内投与では経口投与と比べ吸収が比較的速やかで、門脈系を介さないため、初回通過効果を受けない。"},{"no":90,"text":"静脈内注射は、直接血管内に投与できるため、確実に薬物の効果を期待できる。"},{"no":91,"text":"筋肉内注射では薬物の作用発現は静脈内注射より遅いが、作用の持続時間は長い。"},{"no":92,"text":"有害作用（副作用）は、主作用以外の意図しない薬理作用、とくに有害な症状を生じたものをいう。"},{"no":93,"text":"薬物が生体内に吸収されてから比較的短期間で中毒症状を生じる場合を急性中毒、比較的長期間にわたって生体内に蓄積して中毒症状を生じる場合を慢性中毒と呼ぶ。"},{"no":94,"text":"アナフィラキシー反応は、特定の物質（抗原）により引き起こされる即時型アレルギー反応である。抗菌薬、造影剤、抗血清、ホルモン剤などで発生しやすい。"},{"no":95,"text":"アドレナリン製剤は、通常は筋肉内、もしくは静脈内投与によりショック（とくにアナフィラキシーショック）、気管支喘息、心停止などに用いられる。"},{"no":96,"text":"アドレナリンは交感神経のα1，α2，β1，β2受容体の刺激作用をもつ。"},{"no":97,"text":"アドレナリンは気管支喘息の発作時やアナフィラキシーショックの治療としても用いられる。"},{"no":98,"text":"交感神経β１受容体が刺激されると、心拍数と心収縮力を増加させることで血圧を上昇させる。"},{"no":99,"text":"交感神経α１受容体が刺激されると、末梢の血管を収縮させることで血圧を上昇させる。"},{"no":100,"text":"交感神経β２受容体が刺激されると、気管支を拡張させて喘息様病態を改善させる。"},{"no":101,"text":"β2受容体を豊富に有するのは気管支、腸、血管平滑筋である。"},{"no":102,"text":"アドレナリンはアナフィラキシーショックに対しては即効性のある唯一の薬剤であるが、効果の持続時間は短い。"},{"no":103,"text":"自己心拍が存在するときにアドレナリンを投与すると急激な血圧上昇、不整脈、心不全、肺水腫などの重大な副作用が生じることがある。"},{"no":104,"text":"乳酸リンゲル液に含まれるＬ - 乳酸ナトリウムは、代謝の過程で炭酸水素イオン（HCO3‒）を放出するため、アシドーシスを補正する効果がある。"},{"no":105,"text":"出血を乳酸リンゲル液だけで補おうとすると出血量の３～４倍が必要とされている。"},{"no":106,"text":"亜硝酸薬は、狭心症などの虚血性心疾患の治療薬としてよく用いらいられる。"},{"no":107,"text":"舌下錠やスプレー（舌下エアロゾル剤）の粘膜吸収剤の作用時間は比較的短いが、効果は数分で現れる。"},{"no":108,"text":"亜硝酸薬の効果は数分で現れるため、狭心症発作における応急処置として不可欠なものになっている。"},{"no":109,"text":"降圧薬の種類として、カルシウム拮抗薬などがある。"},{"no":110,"text":"気管支喘息などの気管支攣縮状態に対する対症療法として、重症の発作では医療機関においてアドレナリンなどの注射による治療が行われる。"},{"no":111,"text":"向精神薬とはヒトの精神活動に影響を及ぼす薬剤をいい、これらは依存性が強い。"},{"no":112,"text":"ワルファリンは抗凝固薬として、血栓の進行防止、予防・再発防止に用いられている。"},{"no":113,"text":"ワルファリンはビタミンＫの作用を阻害することにより効果を発現するため、ビタミンＫを多く含む食品（納豆など）を避ける必要がある。近年、ワルファリンは直接作用型経口抗凝固薬（DOAC）という薬剤にとってかわられている。"},{"no":114,"text":"シルデナフィルの副作用として、ニトログリセリンなどの亜硝酸薬と併用すると血圧低下、ショックを呈することがある。"},{"no":115,"text":"ドパミンは、β作用が強いが、高用量ではα作用が出現し、心収縮力増加、腎血流量増加に加え血圧上昇作用を有する。"},{"no":116,"text":"ドパミンの高用量（15～20μg/kg/ 分以上）でα作用が出現する。"},{"no":117,"text":"アドレナリンは心収縮力増加、末梢血管収縮、心拍数増加作用が強い。"},{"no":118,"text":"ノルアドレナリンは、α作用が強く、末梢血管収縮による血圧上昇作用が強い。"},{"no":119,"text":"昇圧薬として、ドパミン、ドブタミン、イソプレナリン、アドレナリン、ノルアドレナリンなどがある。"},{"no":120,"text":"ヒトから採取された血液から作られる製剤を血液製剤といい、血液製剤は各種の血液の成分の減少した病態（血液疾患、出血、外傷、手術など）に対する補充を目的として行われる。"},{"no":121,"text":"ドブタミンの心収縮力増加作用はドパミンより強いが、末梢血管収縮や不整脈の合併が少ない。"},{"no":122,"text":"CPAの傷病者に対する特定行為の一つに、乳酸リンゲル液を用いた静脈路確保のための輸液がある。"},{"no":123,"text":"メディカルコントロールとは、医学的な質を保証する取り組みをいう。"},{"no":124,"text":"メディカルコントロール体制とは、救急現場から医療機関に搬送されるまでの間に救急救命士などが実施する医行為や通信指令員が行う口頭指導などを医学的見地から医師が指示、指導・助言および検証することによって、これらの質を保証する体制を意味する。"},{"no":125,"text":"メディカルコントロール協議会では、救急業務の実施に必要な各種プロトコールの策定に関する事項が協議される。"},{"no":126,"text":"メディカルコントロール体制でのＰＤＣＡサイクルとは、Plan（プロトコールの策定）、Do（医師の指示、指導・助言体制）、Check（事後検証の実施）、Act（再教育体制の整備）である。"},{"no":127,"text":"オンラインメディカルコントロールは、医師が電話や無線などにより活動中の救急救命士と直接通信を行うものである。救急救命士は口頭で特定行為の指示、処置の指導・助言、医療機関選定の助言を得る。"},{"no":128,"text":"事後検証は、プロトコールの対象事例、重症例および対応困難例を中心に医師が医学的な立場から検討することによって行われ、個々の事例を対象に救急救命士の判断と行為を検証するのが目的である。"},{"no":129,"text":"事後検証には、救急活動記録票の検討、救急救命処置の効果検証、症例検討会の実施、搬送後の評価・分析、が含まれる。"},{"no":130,"text":"救急活動記録票は、救急隊が行った一連の救急活動を記録するためのものであり、検証の資料となるほか裁判資料として使われる場合もある。"},{"no":131,"text":"救急救命処置録は記載の日から５年間の保存が義務づけられている。"},{"no":132,"text":"「リスクマネジメント」は、「医療安全管理」と同義語であり、また、「セーフティマネジメント」ともいう。"},{"no":133,"text":"民事訴訟とは、私人間の権利関係に関する紛争の解決を目的とする訴訟をいう。消防機関が当事者となる訴訟は、損害賠償請求事件がほとんどである。"},{"no":134,"text":"刑事訴訟とは、犯罪に対する国家の刑罰権の存否を争う訴訟をいう。救急自動車の交通事故で死傷者を発生させた場合に刑事責任が問われたりすることがあげられる。"},{"no":135,"text":"救急救命士法では、救急救命士が医師の指示なしに特定行為を単独で行うことは禁じられており、違反すると半年以下の懲役もしくは30万円以下の罰金に処せられる。"},{"no":136,"text":"救急救命士が罰金以上の刑に処せられたり、救急業務に関し犯罪または不正行為があった場合には、厚生労働大臣は救急救命士の免許を取り消したり、一定期間の救急救命士の名称使用の停止を命ずることができる。"},{"no":137,"text":"医療事故とは、医療が関連して何らかの人的被害が生じた場合をいい、医療事故のうち、医療者の過失によって生じた患者に不利益をもたらした事故を医療過誤と呼ぶことが多い。"},{"no":138,"text":"医療過誤に伴う法的責任は、民法・刑法・行政法上の責任を問われることがある。"},{"no":139,"text":"薬剤投与を含め、医療事故が起きた場合の救急救命士がとるべき対策として、①傷病者の安全を確保する、②傷病者および家族へ誠実かつ冷静に対応する、③正確な記録を残す、④医療事故発生時の具体的対応策をマニュアル化し再発防止策を作成することなどが最低限必要である。"},{"no":140,"text":"汗を除く唾液・鼻汁・喀痰・尿・便・腹水・胸水などすべての湿性体液には感染性があるものとして取り扱うこと。"},{"no":141,"text":"手指衛生は感染予防策でもっとも基本となる手技である。"},{"no":142,"text":"接触感染には、B型肝炎、C型肝炎、HIV、ノロウイルス、ロタウイルス、MRSAなどがある。"},{"no":143,"text":"清潔とは、滅菌処理されている状態をいい、不潔とは、滅菌処理されていない状態をいう。"},{"no":144,"text":"消毒とは、人体に有害な微生物の感染性をなくすか、数を少なくすることである。"},{"no":145,"text":"滅菌とは、すべての微生物を殺滅させる、または完全に除去することである。"},{"no":146,"text":"消毒用エタノールは、多くの細菌、ウイルスに効果があるが芽胞には作用しない。"},{"no":147,"text":"針刺し事故で感染の危険がある病原性微生物は、主にＢ型肝炎ウイルス（HBV）、Ｃ型肝炎ウイルス（HCV）、およびヒト免疫不全ウイルス（HIV）である"},{"no":148,"text":"針刺し事故の防止策として、安全装置の付いた留置針を使用すること、リキャップをしないこと、手渡ししたり、ストレッチャーの上や床に置かないことなどがある。"},{"no":149,"text":"救急活動中に針刺し事故が発生したら、直ちに大量の流水と石鹸で穿刺部を洗浄する。血液を絞り出す必要はない。また、可能であれば直ちにエタノールまたはポビドンヨードで消毒する。"},{"no":150,"text":"１回の針刺し事故による感染確率は、HBV30％、HCV2～3％、HIV0.3％といわれている。"},{"no":151,"text":"HBV感染者に対し、針刺し事故を起こした救急隊員のHBs 抗原とHBs 抗体がともに陰性であれば、24～48時間以内に免疫グロブリンが投与され、続いてワクチンの接種が行われる。"},{"no":152,"text":"HCVに対する予防薬やワクチンはない。"},{"no":153,"text":"HIV陽性が強く疑われる傷病者に使用した針で事故を起こした場合、できれば２時間以内に抗HIV 薬を服用することにより、針刺し事故後の感染リスクをほぼ回避できるとされる。"},{"no":154,"text":"ETCO2は肺血流量に相関し、肺血流量は心拍出量に等しい。"},{"no":155,"text":"CPR中のETCO2値は胸骨圧迫の効率を反映する。"},{"no":156,"text":"アルコール消毒後は十分に乾燥させる。"},{"no":157,"text":"静脈路確保と輸液の主な目的は、薬剤の静脈内投与である。"},{"no":158,"text":"輸液回路の１mL 当たりの滴数は、成人用回路で20滴、小児用回路で60滴と決められている。20滴で１mL の場合、１滴/秒の速度で滴下すると１分間に３mL、１時間に180mL が輸注される計算になる。"},{"no":159,"text":"静脈留置針のカラーコードは、18Gは深緑、20Gはピンク、22Gは濃紺である。"},{"no":160,"text":"救急救命士による静脈路確保において選択される静脈は、手背静脈、橈側皮静脈、尺側皮静脈、肘正中皮静脈、大伏在静脈、および足背静脈などの末梢静脈に限定されている。"},{"no":161,"text":"静脈路確保を行うときは、駆血帯を穿刺部より中枢側に巻き、うっ血を確認する。"},{"no":162,"text":"穿刺部をアルコール綿で消毒するときは、最初に拭いた部位は再度拭かない。"},{"no":163,"text":"穿刺の際は、静脈留置針の刃面を上にして、皮膚面に対して約15°の角度で皮膚を穿刺する。"},{"no":164,"text":"穿刺は２回までとし、再度の穿刺を行うときは、初回の穿刺部位よりも近位（中枢側）で行う。"},{"no":165,"text":"静脈路確保で、挫滅や骨折のある四肢、熱傷部位、透析シャントのある四肢での穿刺を避ける。"},{"no":166,"text":"アドレナリンのもつα作用により、主に心臓や脳以外の臓器の血管を収縮させる。"},{"no":167,"text":"アドレナリンのもつα作用により、主に心臓や脳以外の臓器の血管を収縮させることで、胸骨圧迫によって得られる血流を心臓や脳に再分配する。"},{"no":168,"text":"心肺停止傷病者に対してアドレナリン投与をする目的は、α作用による全身の血管収縮により、血流を再分配し、心拍再開を促進することが目的である。"},{"no":169,"text":"アドレナリン投与時には、穿刺部位の薬剤の漏れや皮下の腫れを確認する。"},{"no":170,"text":"自己心拍が再開した場合は呼気二酸化炭素分圧の急激な上昇を認める。"},{"no":171,"text":"アドレナリン投与による自己心拍再開後は、陽性変時作用による頻脈性不整脈を引き起こしたり、血圧上昇と心拍数増加が心筋酸素需要量増大を招き、心筋虚血、狭心症、急性心筋梗塞などを引き起こしたりする。"},{"no":172,"text":"アドレナリンの合併症として、自己心拍再開後に、陽性変時作用による頻脈性不整脈を引き起こすことがある。"},{"no":173,"text":"アドレナリン投与の合併症として、心筋虚血、狭心症、急性心筋梗塞などを引き起こす。"},{"no":174,"text":"アドレナリン投与の合併症として、自己心拍再開後の血圧上昇と心拍数増加が心筋酸素需要量増大を招く。"},{"no":175,"text":"アドレナリン投与の合併症として、自己心拍再開後の血圧上昇と心拍数増加が心筋酸素要量増大を招き、心筋虚血、狭心症、急性心筋梗塞発症の可能性、自己心拍再開後の陽性変時作用による頻脈性不整脈誘発の可能性がある。"},{"no":176,"text":"アドレナリン投与の合併症として、薬液が血管外に漏れると、局所の壊死を引き起こす。"},{"no":177,"text":"静脈路などが確保できない場合には、アドレナリンの気管内投与を行ってもよいとしているが、いずれも救急救命士には認められていない。"},{"no":178,"text":"過換気では、心拍出量低下と低二酸化炭素血症による脳血管の収縮により脳血流量の減少が生じる。"},{"no":179,"text":"拡張期に流入する血液量に比例して、心室筋の収縮力も増加することをスターリングの法則という。"},{"no":180,"text":"血管内に投与された乳酸リンゲル液などの細胞外液補充液は理論上、容積比に従って血漿と間質液に１：３の割合で分布する。"},{"no":181,"text":"循環血液量の４０％以上の喪失が起こると傷病者は重篤なショック状態に陥る。"},{"no":182,"text":"肺血栓塞栓症は遊離血栓が肺動脈に詰まることにより発症する。"},{"no":183,"text":"肺血栓塞栓症のもっとも一般的な原因は下肢深部静脈からの血栓である。"},{"no":184,"text":"心原性心肺停止例のうち、市民（バイスタンダー）による心肺蘇生を受けた人の１か月後の生存率と社会復帰率は受けてない人に比べとても高くなっている。"},{"no":185,"text":"心停止の原因の「心原性」とは、心疾患が確定診断されたという意味ではなく、原因として心疾患以外の疾患が特定された例を除いたものと定義される。"},{"no":186,"text":"心原性心肺停止は、刺激伝導系の異常や心筋梗塞など、心臓自体の異常によって生じた致死性不整脈や心収縮力の低下に起因する。"},{"no":187,"text":"非心原性心肺停止には、肺血栓塞栓症や出血・脱水、敗血症性ショック、偶発性低体温症などがある。"},{"no":188,"text":"突然の心停止は致死的不整脈によることが多い。"},{"no":189,"text":"呼吸不全が進行すれば、全身の酸素化とエネルギー代謝が悪化し、代謝性アシドーシスから最終的に心停止をきたす。"},{"no":190,"text":"PaO2が２０ｍｍHg以下では明らかな心収縮力の低下が出現する。"},{"no":191,"text":"呼吸不全による心肺停止の心電図は、心拍数の多い無脈性電気活動から心拍数の少ない無脈性電気活動を経て心静止に至ることが多い。"},{"no":192,"text":"急性中毒のうち、睡眠薬や麻薬ではおもに呼吸抑制が原因となって心肺停止を起こす。"},{"no":193,"text":"急性中毒のうち、三環系抗うつ薬や覚醒剤では主に不整脈や心筋障害が原因となって心肺停止をきたす。"},{"no":194,"text":"電撃傷では、心筋自体の障害は軽度のことが多いが、交流電流の通電で心室細動が起こりやすい。"},{"no":195,"text":"雷撃傷では、直流電流で心静止が発生しやすい。"},{"no":196,"text":"不整脈による心肺停止では、心停止が先行し、まもなく呼吸も停止して心肺停止に至る。"},{"no":197,"text":"突然の心停止の場合、直後に死戦期呼吸と呼ばれる特殊な呼吸がみられることがある。"},{"no":198,"text":"突然の心停止の場合には脳のエネルギーが約10秒で枯渇し、まず大脳の虚血により意識が消失し、続いて呼吸中枢の虚血により呼吸機能停止が起こる。"},{"no":199,"text":"心肺蘇生が行われない場合、約４～５分後に心筋の低酸素により代謝状態が悪化し除細動による心拍再開が困難な状態へと悪化する。"},{"no":200,"text":"心筋の酸素代謝状態は心停止直後から急速に悪化する。心肺蘇生が行われない場合、約４～5分後には心筋の低酸素により代謝状態が悪化する。"},{"no":201,"text":"突然の心原性心停止の場合、短時間であれば人工呼吸を行わずとも、胸骨圧迫を行うだけでも有効な蘇生手段となる。"},{"no":202,"text":"徐脈性でQRS幅の広い無脈性電気活動や心静止を呈する傷病者の予後は悪い。"},{"no":203,"text":"大量出血、緊張性気胸、肺血栓塞栓症などで心停止となった直後の段階では、心筋の酸素化もある程度保たれている。"},{"no":204,"text":"大量出血に伴う心停止では、心電図上は頻脈性でQRS幅の狭い無脈性電気活動を呈することが多い。"},{"no":205,"text":"緊張性気胸に伴う心停止では、心電図上は頻脈性でQRS幅の狭い無脈性電気活動を呈することが多い。"},{"no":206,"text":"肺血栓塞栓症に伴う心停止では、心電図上は頻脈性でQRS幅の狭い無脈性電気活動を呈することが多い。"},{"no":207,"text":"呼吸不全が進行し心停止になった場合、すでに全身の酸素代謝は相当悪化しており、高度の混合性アシドーシスが存在する。"},{"no":208,"text":"無脈性電気活動は、心電図上、6/分以上のQRS を認めるが、総頸動脈の拍動を触れない。"},{"no":209,"text":"無脈性電気活動は、わずかな心拍出量が存在する可能性はあるが、脳に有効な循環を生じない点で心停止と判断する。"},{"no":210,"text":"アシドーシスが原因のPEAの心電図は幅広のQRSの徐脈を示すことが多い。"},{"no":211,"text":"心タンポナーデに伴うＰＥＡの心電図では狭いＱＲＳ幅の頻拍を示すことが多い。"},{"no":212,"text":"心電図上、心拍数が６/分以下のものはQRSがあっても心静止として扱う。"},{"no":213,"text":"心肺蘇生中に必要とされる肺胞換気量は自発呼吸の30～40％程度でよい。"},{"no":214,"text":"冠動脈の血流発生の原動力となる冠灌流圧は、大動脈圧ー右房圧で表され、胸骨圧迫を解除している間に発生する。"},{"no":215,"text":"脳灌流の原動力となる脳灌流圧（大動脈圧ー内頸静脈圧）は胸骨圧迫中に生じる。"},{"no":216,"text":"理想的条件下における胸骨圧迫による血圧は70mmHg以上あり、時に100mmHgを超える。"},{"no":217,"text":"心肺蘇生中の肺血流量は正常安静値の３０％程度である。"},{"no":218,"text":"理想的条件下における胸骨圧迫中の冠血流量は正常安静時の５～３５％である。"},{"no":219,"text":"理想的条件下における胸骨圧迫中の脳血流量は正常安静時の３０～４０％である。"},{"no":220,"text":"アドレナリンなどの血管収縮薬は、筋肉、皮層、脂肪組織などの動脈に対しては強い収縮作用を示す。それに比べ脳の動脈、冠動脈などに対する収縮作用が弱い。"},{"no":221,"text":"血管収縮薬により全末梢血管抵抗が増加する結果、大動脈圧が上昇し、圧迫中には脳灌流圧を、圧迫解除時には冠灌流圧を上昇させ、心肺蘇生の効果を高めることが期待される。"},{"no":222,"text":"血管収縮薬は胸骨圧迫の効率を向上させる目的で使用されるものであり、あくまでも良質な胸骨圧迫が行われていることが前提となる。"},{"no":223,"text":"過換気による胸腔内圧の上昇は、圧迫解除時に期待する静脈還流を妨げ、心拍出量を減少させる。"},{"no":224,"text":"心肺停止の持続時間は、心拍再開後の機能回復の程度を決定する重要な因子となる。"},{"no":225,"text":"一過性の心停止によって脳全体が虚血に陥ることを全脳虚血といい、その影響は心肺停止傷病者の心拍再開後に最大の問題となる。"},{"no":226,"text":"脳の再灌流障害は、脳血流停止が10分間以上続いた場合に非常に高い確率で発生する。"},{"no":227,"text":"気絶心筋は、心拍再開の２～５時間後にもっとも重症化する。"},{"no":228,"text":"心拍数と血圧は心拍再開直後に通常以上までいったん上昇することもあるが、すぐに低下することも多い。これには心筋の虚血再灌流障害、蘇生に用いたアドレナリンや電気ショックによる心筋障害なども関与すると考えられる。"},{"no":229,"text":"長時間の心肺停止が続いていると心拍再開直後には自発呼吸はすぐには出現しない。"},{"no":230,"text":"蘇生後４～６時間に発生する最大の合併症は再度の心停止である。"},{"no":231,"text":"心停止前からの低体温は、虚血による脳や心筋の障害を軽減する。"},{"no":232,"text":"心拍再開後に高血糖を呈する例は神経学的な回復が不良である。"},{"no":233,"text":"急性心筋梗塞と不安定狭心症は急性冠症候群（acute coronary syndrome：ACS）と呼称される。"},{"no":234,"text":"急性冠症候群とは、冠動脈内に発生した粥腫の破裂や、攣縮による冠動脈内膜の損傷などにより、冠動脈内に血栓形成が進行して冠動脈血流量が絶対的に減少した病態である。"},{"no":235,"text":"急性心筋梗塞は発症初期に心室性で不整脈が起こりやすく、とくに危険なタイプの心室性不整脈は、心室頻拍や心室細動に移行しやすい。"},{"no":236,"text":"急性心筋梗塞の症状で、高齢者や糖尿病を合併している場合、胸痛を訴えないこともある（無痛性梗塞）"},{"no":237,"text":"不安定狭心症は、急性冠症候群として急性心筋梗塞と同様の対応が行われる。"},{"no":238,"text":"QT 延長症候群では、トルサードドポアンツ型心室頻拍や心室細動が起こりやすくなる。電解質異常や薬剤などが原因となる。"},{"no":239,"text":"トルサードドポアンツ型と呼ばれるものはQRS様波形を有する多形性心室頻拍で、数拍ごとに波形が変化していくのが特徴である。"},{"no":240,"text":"静脈血栓症が生じやすい状態として、高齢、うっ血性心不全、妊娠、癌、肥満などがある。"},{"no":241,"text":"急性肝炎でA型肝炎とB型肝炎は頻度が高く、C型肝炎の比率は減少している。"},{"no":242,"text":"急性糸球体腎炎は、糸球体にびまん性炎症が起こるⅢ型アレルギーである。"},{"no":243,"text":"脱水症は、主に水分が失われた水欠乏性脱水（高張性脱水）とナトリウムの喪失が主体となったナトリウム欠乏性脱水（低張性脱水）とに大別される。いずれもが同等に減少した場合を混合性脱水（等張性脱水）という。"},{"no":244,"text":"低張性脱水は、下痢や大量の発汗に対して水分のみを補給した場合や利尿薬の投与などにより生じる。"},{"no":245,"text":"高ナトリウム血症の原因は、水分摂取の減少や水分喪失の増加（高張性脱水）、あるいはナトリウムの過剰摂取である。"},{"no":246,"text":"低ナトリウム血症の主な症候は、全身倦怠感、脱力感、意識障害、深部腱反射の低下、呼吸困難、嘔気・嘔吐、低体温、病的反射の出現などである。"},{"no":247,"text":"カリウムは神経や筋、とくに心筋の興奮性と関連が深い。"},{"no":248,"text":"高カリウム血症はアシドーシスによる細胞内カリウムの移動が原因の一つである。"},{"no":249,"text":"高カリウム血症の主な症候は心電図変化、筋脱力感である。"},{"no":250,"text":"高カリウム血症は、7mEq/L以上になるとQRS幅が拡大し、さらに心室細動から心停止に至る。"},{"no":251,"text":"低カリウム血症は、全身倦怠感、食思不振、嘔吐などの非特異的な症候のほかに、筋肉の障害、腎機能障害、耐糖能の低下を生じる。"},{"no":252,"text":"呼吸性アシドーシスは、肺胞での換気が障害されて、血中の二酸化炭素分圧上昇が原因となる。"},{"no":253,"text":"過換気症候群が急性の呼吸性アルカローシスの典型である。"},{"no":254,"text":"代謝性アシドーシスの原因として、ショックに伴う乳酸の産生、糖尿病ケトアシドーシスにおけるアセト酢酸やヒドロキシ酪酸の蓄積、酸の誤飲による中毒、腎不全による酸の排泄障害などがある。"},{"no":255,"text":"腎不全による酸の排泄障害でアシドーシスとなる。"},{"no":256,"text":"アシドーシスになると、呼吸中枢が刺激されて肺胞換気が増大するためPaCO2が低下する。"},{"no":257,"text":"代謝性アルカローシスでは、呼吸性の代償機構が働き、PaCO2を上昇させることによってｐHの変化を最小限にとどめようとする。"},{"no":258,"text":"初回のアレルゲン曝露後にはIgE に属する抗体が肥満細胞（マスト細胞）や好塩基球の表面に結合している。"},{"no":259,"text":"特定の食物を摂取して１～２時間以内に運動したときに発症するアレルギー反応は、食物依存性運動誘発アナフィラキシーと呼ばれ、IgE 依存性である。"},{"no":260,"text":"HIVに感染すると、Ｔリンパ球やマクロファージなどが破壊され、しだいにその数を減じ、一定数を割るとAIDS を発症する。"},{"no":261,"text":"AIDSは、健康人はあまり発症しない感染症に罹患しやすくなる（日和見感染）。"},{"no":262,"text":"多くの医薬品は体内で代謝された後に腎臓から排泄されるため、高齢者では薬剤の代謝が遅延する。"},{"no":263,"text":"妊婦は、循環血漿量が増加し、妊娠32～34週にピークとなり、非妊娠時の約50％増となる。"},{"no":264,"text":"中毒物質の吸収経路別では、経静脈＞吸入＞経口＞経皮の順で薬物の吸収が速い。"},{"no":265,"text":"脂溶性の中毒物質は水溶性の中毒物質と比較して吸収が速く、中毒症状は強い。"},{"no":266,"text":"経口吸収では、門脈を経由して肝臓で代謝を受ける初回通過効果により中毒作用が減弱する。"},{"no":267,"text":"静脈内注射は、生体吸収量は多いが持続時間は短い。"},{"no":268,"text":"皮下注射の薬液吸収速度は静脈内注射より遅い。"},{"no":269,"text":"薬物はその投与方法により、その吸収の量および速度が異なり、同じ薬物でも静脈内注射がもっとも速やかに薬効が現れる。"},{"no":270,"text":"体内へ吸収された中毒物質は、肝臓で代謝を受けて無害な代謝産物まで分解される場合や、代謝を受けずにそのまま尿中や胆汁中、呼気中に排泄される場合もある。"},{"no":271,"text":"胆汁中に排泄された化学物質が、小腸から再び吸収されることを腸肝循環という。"},{"no":272,"text":"重金属中毒の治療薬であるBAL®などのキレート剤は、中毒物質と強く結合して尿からの排泄を促進する。"},{"no":273,"text":"定型（第一世代）抗精神病薬は、内服による急性中毒ではQT延長などの循環不全、トルサードドポアンツを含む心室頻拍、心室細動などの致死性不整脈を生じる。"},{"no":274,"text":"有機リン系殺虫剤の中毒の対症療法として、抗コリン薬（抗ムスカリン薬）である硫酸アトロピンも使用される。"},{"no":275,"text":"脂溶性が高い薬物は脂肪組織に蓄積しやすい。"},{"no":276,"text":"薬物依存とは、精神依存、耐性、離脱症候を生じる身体依存のいずれかが起こることをいう。"},{"no":277,"text":"薬物の通常の摂取量では期待する効果が得られなくなることを耐性という。"},{"no":278,"text":"覚醒剤は精神依存が強いが、身体依存はない。また、耐性が起こるため、次第に使用量が増加する。"},{"no":279,"text":"低体温では、体温が１℃低下すれば酸素消費量はおそ６～８％減少する。"},{"no":280,"text":"愛知県救急隊心肺蘇生法プロトコール及び愛知県救急隊心肺停止前プロトコールは、救急隊が行うべき心肺蘇生法等の実施手順を示すものである。"},{"no":281,"text":"オンラインメディカルコントロールは、救急救命士の行う特定行為の単なる許可ではない。"},{"no":282,"text":"救急救命士を含む救急隊は、法令遵守とともに、プロトコールに沿った活動が基本である。"},{"no":283,"text":"薬剤投与適応の条件のひとつは、初期心電図がＶＦ、脈なしＶＴ、ＰＥＡ、目撃のある心静止のどれかであることである。"},{"no":284,"text":"薬剤投与を目的とした活動は５ピリオド（１０分）以内、その他は３ピリオド（６分）以内を目途とし、活動隊員数、現場状況、傷病者状態から早期搬送を考慮してもよい。"},{"no":285,"text":"先着隊の活動がある場合は、必要な救急救命処置のみの実施とし、トータル現場活動が５ピリオド（１０分）または３ピリオド（６分）を大幅に超えないよう早期搬送に努める。"},{"no":286,"text":"初回の調律確認時の波形を初期心電図とする。"},{"no":287,"text":"自動胸骨圧迫器を使用する場合は、装着するときに１０秒以上胸骨圧迫が中断しないようにする。"},{"no":288,"text":"CPR中は、連続的呼気終末二酸化炭素（ETCO2）モニターを装着し、換気及び胸骨圧迫の質の指標として活用する。"},{"no":289,"text":"静脈路確保は、静脈が触認できない場合は実施しない。"},{"no":290,"text":"自己心拍再開後の低血圧（収縮期９０未満）に対しては、医師の指示に基づき１～２Ｌまでは全開で輸液負荷を行う。"},{"no":291,"text":"年齢・性別とともに発生形態・心停止原因、心電図、患者状態を報告し、プロトコール手順と異なる指示が与えられた場合には、法律に許される範囲でその指示内容に従うものとする。"},{"no":292,"text":"現場活動中における傷病者の状態や除細動実施の有無に関わらず、車内収容後における初回の除細動に限り包括的指示とすることができる。"},{"no":293,"text":"静脈路確保の実施は、およそ2分以内で２回までとする。"},{"no":294,"text":"気道確保器具による気道確保を行った場合は、直ちに連続的呼気終末二酸化炭素（ETCO2）モニターを装着する。"},{"no":295,"text":"薬剤投与適応の条件のひとつは心かつ肺停止であること。"},{"no":296,"text":"愛知県の薬剤投与の条件は、①心肺機能停止、②目撃のない心静止以外、③15才以上の成人の３つである。"},{"no":297,"text":"薬剤投与の処置を行う場合には、処置にあたる者３名以上（自動胸骨圧迫器を使用する場合は２名以上）の人員が確保できていなければならない。"},{"no":298,"text":"原則的に、既存の中心静脈ルートを使用してのアドレナリン投与及び心停止前の輸液は実施しない。"},{"no":299,"text":"既存の末梢ルートについては、滴下状態などルートが使用できることが確認できれば、薬液を乳酸リンゲル液に付け替え使用することができる。"},{"no":300,"text":"目撃のない心静止の傷病者のCPR活動中に波形変化があったとしても薬剤適応とはならない。"}]},"expanded":{"name":"処置拡大試験","icon":"🚑","items":[{"no":1,"text":"救急救命士法第４４条では、医師の具体的な指示を受けなければ特定行為を行ってはならないとされている。"},{"no":2,"text":"乳酸リンゲル液を用いた静脈路確保および輸液は、増悪するショックやクラッシュ症候群に至る可能性が高い傷病者に対して、静脈から輸液を投与する目的で行われる処置である。"},{"no":3,"text":"処置範囲拡大は、特定行為の対象者が心肺機能停止前の重度傷病者であり、医療機関収容前に処置をすることで重篤化を防ぐことを目的としている。"},{"no":4,"text":"救急救命士法第４６条第１項で「救急救命士は、救急救命処置を行ったときは、遅滞なく厚生労働省令で定める事項を救急救命処置録に記載しなければならない」と定められている。"},{"no":5,"text":"ショックとは、生体に対する侵襲あるいは侵襲に対する生体反応の結果、重要臓器の血流が維持できなくなり、細胞の代謝障害や臓器障害が起こり、生命の危機に至る急性の症候群である。"},{"no":6,"text":"循環血液量減少性ショックでは、心臓に戻る血液量（静脈還流量）が減少し、左心室から打ち出される血液量（1回拍出量）も減少する。"},{"no":7,"text":"心原性ショックとは、心臓のポンプ作用の低下によって生じるショックである。"},{"no":8,"text":"血液分布異常ショックでは、血管の異常な拡張によって血圧が低下すると同時に、酸素需要に応じた臓器組織への血流分布が適切に行えなくなる。"},{"no":9,"text":"アナフィラキシーによるショックや、感染性ショック（敗血症性ショック）は、全身の血管が拡張し全末梢血管抵抗が低下する。また血管透過性亢進による循環血液量の減少や心機能障害も関与する。"},{"no":10,"text":"神経原性ショックは、交感神経系が広範囲に遮断されて血管の緊張が保てなくなり、代償的な心拍数の増加と心収縮力の増強も抑制され、血圧が低下する。"},{"no":11,"text":"心外閉塞・拘束性ショックは、心臓外の因子により血流が障害されてショックが生じる。"},{"no":12,"text":"心タンポナーデは、心嚢内に血液や浸出液が貯留した結果、心臓を周囲から圧迫して心臓の拡張障害をきたしている状態である。"},{"no":13,"text":"肺血栓塞栓症は、主に下肢の深部静脈に生じた血栓が静脈壁から剥がれて流れ、右心系を経由して肺動脈に詰まったものである。"},{"no":14,"text":"緊張性気胸は、胸膜腔に貯留した空気によって胸腔内圧が上昇し、静脈還流が阻害されたり胸部臓器が圧迫されたりした結果、心拍出量の低下をきたしている状態をいう。"},{"no":15,"text":"ショックにおいて、半坐位で外頸静脈の怒張が確認できる場合は、心原性ショック、心外閉塞・拘束性ショックを考える。"},{"no":16,"text":"ショックに対する代償反応は、①心機能の亢進、②心臓の前負荷増加、③血流の再分配に分けられる。"},{"no":17,"text":"ショックに対する代償反応として、交感神経系は心臓や血管に対して直接作用するだけでなく、内分泌系である副腎髄質を介したカテコラミンの分泌促進を通じて関与する。"},{"no":18,"text":"ショックにおける組織への供給量減少が最大の問題となるのは酸素である。"},{"no":19,"text":"救急救命士による病院前での輸液の目的は、医療機関到着までの間、重要臓器の最低限の灌流を保ち、ショックの増悪を防ぐことである。"},{"no":20,"text":"輸液による循環血液量の回復に伴う循環動態の改善効果は、心拍数の減少、血圧の上昇、各種ショック徴候の軽減として観察される。"},{"no":21,"text":"出血性ショックでは血圧低下に対して輸液・輸血をするのが対症療法であり、手術で出血を止めることが原因療法となる。"},{"no":22,"text":"救急現場でショックに伴うチアノーゼに対し酸素投与を行うのは対症療法の一つであるが、末梢組織への酸素供給量を増加させ、ショックの病態を改善するという重要な意義をもつ。"},{"no":23,"text":"血液分布異常性ショックは、静脈路確保と輸液の対象となり得る。ただしアナフィラキシーを原因とし、傷病者がエピペンを所持している場合には、これを用いて筋肉内注射を行うことを優先する。"},{"no":24,"text":"心外閉塞・拘束性ショックに対して急速輸液は根本的治療にはならないため、搬送を優先するほうが有益となる場合がある。"},{"no":25,"text":"救急救命士による静脈路確保において選択される静脈は、末梢静脈に限定されている。"},{"no":26,"text":"救急救命士による静脈路確保において選択される静脈は、手背静脈、橈側皮静脈、尺側皮静脈、肘正中皮静脈、大伏在静脈及び足背静脈である。"},{"no":27,"text":"外筒が血管外に留置された場合、または留置中に静脈損傷をきたした場合は、滴下不良になるとともに、輸液製剤が皮下に注入されて局所に腫脹をきたす。"},{"no":28,"text":"電解質輸液製剤は、電解質濃度が血漿とほぼ等しい等張電解質輸液と、血漿よりも低い低張電解質輸液に大別される。"},{"no":29,"text":"等張電解質輸液製剤としての乳酸リンゲル液や酢酸リンゲル液は、細胞外液補充のために用いられる。"},{"no":30,"text":"輸液製剤には、栄養補給が目的の栄養輸液製剤がある。"},{"no":31,"text":"乳酸リンゲル液は、電解質濃度と浸透圧を細胞外液に近似させることで、電解質及び水分の補給を可能としている。"},{"no":32,"text":"乳酸リンゲル液は、塩化カルシウム、塩化カリウム、塩化ナトリウム、乳酸ナトリウムを含む注射液である。"},{"no":33,"text":"救急救命士が輸液製剤として使用できるのは、法的に乳酸リンゲル液に限られている。"},{"no":34,"text":"体重に占める水の割合は約60％であり、そのうち細胞内液は40％、細胞外液は20％である。"},{"no":35,"text":"体重の細胞外液のうち5％は血管内に血漿成分として、15％は細胞と細胞の間の間質液として存在する。"},{"no":36,"text":"血液の量は、体重の８％である。"},{"no":37,"text":"静脈内に投与された乳酸リンゲル液は、細胞外と細胞内の水分布の比率に従い徐々に血管外に移動する。このため出血を乳酸リンゲル液だけで補おうとすると出血量の3～4倍が必要である。"},{"no":38,"text":"ショックの傷病者に対する輸液速度は、急速輸液を原則とするが、医師の指示があればそれに従う。"},{"no":39,"text":"外傷による出血の場合、根本的な止血が完了していない段階での血圧上昇（正常化）による損傷血管の止血血栓の遊離と、それに伴う出血の助長で、生存率などの最終転帰を悪化させる可能性が指摘されている。"},{"no":40,"text":"明らかな心原性ショックと判断されるときは、心肺停止前の輸液の適応から除外する。"},{"no":41,"text":"心外閉塞・拘束性ショックを来たす疾患において、緊張性気胸の救命には胸腔ドレナージ、心タンポナーデには心嚢ドレナージが不可欠である。"},{"no":42,"text":"搬送中にショック徴候の改善が認められた場合は、医師に状況を報告のうえ、指示があれば輸液速度を再設定する。"},{"no":43,"text":"クラッシュ症候群は、四肢や殿部が長時間圧迫されて生じた横紋筋融解により、救出後の圧迫解除を経て高カリウム血症に伴う不整脈や高ミオグロビン血症に伴う急性腎不全、乳酸によるアシドーシスを呈する病態である。"},{"no":44,"text":"クラッシュ症候群は、通常は圧迫状態が２～４時間以上続いた場合に発生するが、時には１時間程度の圧迫の後に発生することもある。"},{"no":45,"text":"クラッシュ症候群では、圧迫によって骨格筋細胞膜が過度に伸展されたり筋組織の虚血が起こったりするために、受傷部位に骨格筋の壊死（横紋筋融解）が生じる。"},{"no":46,"text":"クラッシュ症候群は、高カリウム血症やショック、急性腎不全などの全身症状を発症するほか、局所症状としてコンパートメント症候群を合併することがある。"},{"no":47,"text":"クラッシュ症候群では、再開通に伴って流入した血液から水分が漏れ出し、患部では浮腫が進行する一方、全身では循環血液量が減少する。"},{"no":48,"text":"クラッシュ症候群では、圧迫解除に伴う再灌流により、漏出したカリウムが原因となって心室細動などの致死的不整脈を誘発する。"},{"no":49,"text":"倒壊した建物の下敷きになり、四肢が長時間圧挫された傷病者では筋組織の壊死をきたしたクラッシュ症候群を考慮する。"},{"no":50,"text":"クラッシュ症候群の発生が危惧される場合は、救出前に静脈路を確保したうえで1,000～1,500ｍＬ/時の速度で乳酸リンゲル液の投与を開始することが望ましい。"},{"no":51,"text":"クラッシュ症候群は、救出後の心室細動発生を念頭に置き、あらかじめ除細動パッドを貼付して心電図をモニターしておく。"},{"no":52,"text":"クラッシュ症候群では、救出されるまでは局所の痛みを訴えるのみでバイタルサインを含めた全身状態に大きな問題がないことが多いが、救出後に急激に悪化するため注意が必要である。"},{"no":53,"text":"クラッシュ症候群では、ショックや黒色から褐色の尿（ポートワイン尿）がないか観察する。"},{"no":54,"text":"クラッシュ症候群では、救出作業に長時間を要する場合には、輸液を開始しつつ可能なかぎリドクターカーなどを利用して医師の出場を要請する。"},{"no":55,"text":"各資器材や輸液製剤、薬液などの点検は始業前にすませておく。"},{"no":56,"text":"輸液製剤使用時には、品名、使用期限、色調、密閉状態を確認する。"},{"no":57,"text":"静脈路確保の準備として、ローラークランプを開放し、輸液回路内の空気を抜き、清潔に保つために輸液回路先端を輸液回路の袋に収める。"},{"no":58,"text":"静脈路穿刺部位は、原則として挫滅、骨折、熱傷、蜂窩織炎などの感染症、麻痺などのある四肢への穿刺は避ける。"},{"no":59,"text":"静脈路穿刺部位は、透析シャントのある四肢への穿刺は避ける。"},{"no":60,"text":"妊娠後期の妊婦に対する静脈路確保は、増大した子宮により下大静脈や骨盤静脈が圧排され、部分的な静脈圧の亢進がみられることから、横隔膜より頭側の血管で実施する。"},{"no":61,"text":"穿刺部位が関節部の場合、搬送時に関節が屈曲することにより外筒が折れ曲がるため、十分な流量が得られなくなる場合や抜去されることがある。この場合は必要に応じて、関節を伸展位に固定する。"},{"no":62,"text":"手関節に近い部分の橈側皮静脈を穿刺するときには橈骨神経の損傷をきたすことがある。"},{"no":63,"text":"肘窩の尺側皮静脈の近くには上腕動脈や正中神経が走行しているため、穿刺時にそれらを損傷する可能性がある。"},{"no":64,"text":"肘窩付近の静脈穿刺をする場合には深く穿刺しないように注意する。"},{"no":65,"text":"傷病者の汗を除く分泌物、血液、排泄物、体液、粘膜、傷がある皮膚などは感染性があるものとして取り扱う。"},{"no":66,"text":"救急救命士の処置範囲の拡大に伴い、救急現場活動での静脈路確保の実施数が増加しており、針刺し事故の危険性が高まっている。"},{"no":67,"text":"針刺し事故予防のために、安全装置の付いた静脈留置針を使用する。また、リキャップはしない、もしくはリキャップ不要の注射器を使用する。"},{"no":68,"text":"針刺し事故予防のために、専用容器は静脈路確保後、手の届く場所に置く。また、静脈留置針は穿刺した救急救命士が責任をもって専用容器に捨てる。"},{"no":69,"text":"針刺し事故の予防のために、手渡ししたり、一時的にストレッチャーの上や床に置いたりしない。"},{"no":70,"text":"針刺し事故を起こしてしまったときは、直ちに大量の流水と石けんで穿刺部を洗浄する。"},{"no":71,"text":"針刺し事故を起こしてしまったときに、穿刺部を洗浄した後に血液を絞り出す必要はない。また、口で吸い出してはならない。"},{"no":72,"text":"輸液バッグを落としたり寝かせたりするとドリップチャンバー内の空気が回路の下流に流れ込み、体内に気泡が流入して塞栓をきたす可能性がある。"},{"no":73,"text":"静脈路確保のための時間はできるかぎり短縮する必要があるので、静脈路確保の必要性が予測される場合には、出動中の救急車内で輸液回路などの準備を行う。"},{"no":74,"text":"同じ静脈で再度の穿刺を行うときは、初回の穿刺部より近位（中枢側）で行うことを原則とする。"},{"no":75,"text":"細胞内では、呼吸で得た酸素を利用して栄養素を酸化的に分解し、そのときに発生するエネルギーをアデノシン三リン酸（ＡＴＰ）という形にして生命維持のための活動に利用する。"},{"no":76,"text":"三大栄養素である糖質、脂質、蛋白質はそれぞれ解糖、β酸化、アミノ基転移という過程を経て、共通の代謝経路に入り、最終的にアデノシン二リン酸（ＡＤＰ）とリン酸からＡＴＰが合成される。"},{"no":77,"text":"ＡＴＰは貯蔵出来ないため、使う直前にそのつど合成される。"},{"no":78,"text":"脳の活動には多量のエネルギーを必要とし、エネルギー源の大部分はブドウ糖である。"},{"no":79,"text":"肝臓では、グリコーゲンの合成・分解・貯蔵を行い、必要に応じてブドウ糖を血中に供給して血糖値を調整している。またアミノ酸や脂肪からも糖の生成を行い血中に糖を供給している。"},{"no":80,"text":"通常の好気性代謝は、ピルビン酸がミトコンドリアに入りアセチルCoAに代謝され、TCAサイクルと電子伝達系を経てブドウ糖1分子から30分子前後のATPを合成する。"},{"no":81,"text":"酸素が欠乏した嫌気性代謝では解糖が亢進し、ピルビン酸が乳酸となり乳酸アシドーシスをきたす。ブドウ糖1分子からのATP産生は2分子と少量であり、その産生量は生命の維持には不十分である。"},{"no":82,"text":"膵臓は外分泌器官として膵液を分泌するだけでなく、血糖調整にかかわるインスリンやグルカゴンを分泌する内分泌器官としても機能している。"},{"no":83,"text":"血糖を上昇させるホルモンは、グルカゴン、カテコラミン、糖質コルチコイド、成長ホルモン、甲状腺ホルモンなど複数ある。"},{"no":84,"text":"インスリンは血糖値（ブドウ糖の血中濃度）を低下させる唯一のホルモンであり、血糖値の上昇に応じて分泌される。"},{"no":85,"text":"膵臓には、インスリンを分泌するβ細胞、グルカゴンを分泌するα細胞などが集まった島状の細胞塊が多数形成されており、これを膵島（ランゲルハンス島、あるいはラ氏島）と呼ぶ。"},{"no":86,"text":"インスリンの作用で、ブドウ糖は骨格筋細胞と肝細胞ではグリコーゲンの合成に利用される。"},{"no":87,"text":"インスリンの作用で、ブドウ糖は脂肪細胞では中性脂肪の合成に利用される。"},{"no":88,"text":"グルカゴンは血糖値の低下に応じて分泌され、肝臓のグリコーゲンを分解させて血糖値を上昇させる。"},{"no":89,"text":"血中のブドウ糖濃度を血糖値という。"},{"no":90,"text":"インスリンは持続的にも分泌されている（基礎分泌）が、食物が消化・吸収されて体内に取り込まれ血糖値が上昇しはじめると急激に増加（追加分泌）する。"},{"no":91,"text":"インスリンは、肝臓・筋肉・脂肪組織などのインスリン標的細胞に作用し、細胞への血糖の取り込みを促すことで血糖降下作用を発揮する。"},{"no":92,"text":"血糖値が高い状態が長時間続くと、血管内のブドウ糖はさまざまな蛋白質と結合する。"},{"no":93,"text":"赤血球の蛋白質であるヘモグロビン（Hb）と結合したものがグリコヘモグロビン（ＨｂＡ１ｃ）である。"},{"no":94,"text":"HbA１ｃ値によって過去１～２カ月の血糖値の平均的な状態を知ることができる。"},{"no":95,"text":"１型糖尿病の発症年齢のピークは１０～１５歳であるが、成人してからも発症する。"},{"no":96,"text":"2型糖尿病は糖尿病患者のほとんどを占める。中年以降に緩徐に発症することが多いが、若年者にも生じ得る。"},{"no":97,"text":"自己免疫疾患などの治療のために副腎皮質ステロイドの投与を継続した場合には糖尿病をきたすことがある。これをステロイド糖尿病という。"},{"no":98,"text":"妊娠中は、胎盤から分泌されるホルモンがインスリン感受性を低下させることが誘因となって一過性の糖尿病（妊娠糖尿病）をきたすことがあるが、多くは出産とともに血糖値が正常化する。"},{"no":99,"text":"糖尿病の合併症には、糖尿病網膜症、糖尿病腎症、糖尿病神経障害、糖尿病足病変、大・中動脈の動脈硬化などがある。"},{"no":100,"text":"糖尿病腎症は、腎糸球体の毛細血管が損傷され腎性腎障害をきたすもので、徐々に進行し末期腎不全に至った場合は、生命維持のために人工透析が必要となる。"},{"no":101,"text":"糖尿病患者は健康人と比較して脳梗塞や心筋梗塞を発症するリスクが2～3倍あるとされている。"},{"no":102,"text":"糖尿病患者が心筋梗塞をきたした場合でも典型的な胸痛が生じず、いわゆる無痛性心筋梗塞となりやすい。"},{"no":103,"text":"食事療法と運動療法でHbA１ｃ値が目標を達成できない場合には、経口血糖降下薬やインスリンによる薬物療法が追加される。"},{"no":104,"text":"経口血糖降下薬は、肝臓や骨格筋のインスリン感受性改善、膵ランゲルハンス島からのインスリン分泌促進、消化管での糖吸収遅延、尿中への糖排泄促進など、さまざまな作用機序がある。"},{"no":105,"text":"インスリン製剤には、超速効型、速効型、中間型、混合型、持効溶解型など、効果の発現や持続時間が異なる多様な製剤が開発されている。"},{"no":106,"text":"インスリン製剤の投与は、投与量をダイヤルなどで調節できる専用のインスリン注射器を用いて、傷病者本人または家族らによる皮下注射で行われる。"},{"no":107,"text":"インスリンの基礎分泌を模して、長時間にわたって作用する製剤が中間型インスリン、持効溶解型インスリンである。"},{"no":108,"text":"インスリンの追加分泌を模して、短時間に作用する製剤が超速効型、速効型インスリンである。"},{"no":109,"text":"超速効型の主なインスリン製剤の一般的な注射のタイミングは食事直前である。"},{"no":110,"text":"超速効型の主な商品名として、ノボラピッド、ヒューマログ、アピドラ、フィアスブ、ルムジェブなどがある。"},{"no":111,"text":"速効型の主なインスリン製剤の一般的な注射のタイミングは食事３０分前である。"},{"no":112,"text":"速効型の主な商品名として、ノボリンR、ヒューマリンRなどがある。"},{"no":113,"text":"携帯型インスリン注入ポンプを用いて、インスリンを持続的に注入する方法は、持続皮下インスリン注入療法（インスリンポンプ療法）と呼ばれる。"},{"no":114,"text":"持続グルコースモニタリングシステムとは、皮下組織のブドウ糖濃度を連続的に測定する装置である。インスリンポンプと連動して使用されることもある。"},{"no":115,"text":"健康人の血糖値は空腹時でも70～ 110mg/dLの範囲に保たれる。"},{"no":116,"text":"発汗、眠気、意識レベルの低下などの症候が出現する状態を低血糖症という。"},{"no":117,"text":"低血糖症の基準値は、70mg/dL以下とするのが一般的である。"},{"no":118,"text":"血糖値が下がりはじめると、空腹感、あくびなどが出現し、倦怠感が強くなる。次に、発汗、振戦、動悸などの交感神経症候が、そして中枢神経症候が出現する。"},{"no":119,"text":"低血糖症状の個人差は大きい。"},{"no":120,"text":"低血糖の症状において高齢者では交感神経症状の出現が乏しく、中枢神経症状が中心となるため認知症と誤認されることがある。"},{"no":121,"text":"血糖値がおよそ５５ｍｇ/ｄＬを下回るとインスリンに拮抗する（血糖を上昇させる）アドレナリン、ノルアドレナリンなどのホルモン分泌が増加する。"},{"no":122,"text":"血糖値がおよそ５５ｍｇ/ｄＬを下回ると、発汗、振戦、動悸、不安感、頭痛、顔面蒼白などの交感神経症状が出現する。"},{"no":123,"text":"血糖値がおよそ５５ｍｇ/ｄＬよりもさらに低下すると、ブドウ糖の欠乏などにより中枢神経症状が出現する。"},{"no":124,"text":"血糖値がおよそ５５ｍｇ/ｄＬよりもさらに低下すると、ブドウ糖の欠乏などにより眠気、脱力、めまい、集中力低下、見当識の低下、攻撃的言動などが出現する。"},{"no":125,"text":"血糖値が３０ｍｇ/ｄＬ程度となれば、大脳機能が著明に低下し、意識レベルの低下、けいれん、昏睡をきたす。通常は脳血管障害を示唆する片麻痺が、低血糖でもまれに生じる。"},{"no":126,"text":"重篤な低血糖が長時間継続すると死に至る場合がある。"},{"no":127,"text":"低血糖が長時間続いた場合、血糖が回復しても意識障害などが遷延することがある。"},{"no":128,"text":"低血糖を繰り返すと、高齢期の認知機能低下が顕著になるとの報告もある。"},{"no":129,"text":"低血糖にさらされる頻度が増すと、低血糖を自覚する閾値が上昇する。"},{"no":130,"text":"低血糖にさらされる頻度が増すと、拮抗ホルモンの反応も低下する。"},{"no":131,"text":"低血糖にさらされる頻度が増すと、発汗、振戦などの警告症状なく、急激に意識障害などの中枢神経症状が出現する。これを無自覚低血糖という。"},{"no":132,"text":"低血糖をきたす原因・病態には、経口血糖降下薬、インスリン、重症感染症、アルコール多飲、肝不全、悪性腫瘍、胃切除後、インスリノーマ、副腎不全、下垂体機能低下症、シックディなどがある。"},{"no":133,"text":"低血糖の原因として、もっとも多いのは経口血糖降下薬やインスリン製剤などの糖尿病治療薬による薬剤性低血糖である。"},{"no":134,"text":"薬剤性低血糖の要因は、血糖降下薬やインスリン製剤の開始、増量、種類の変更や追加のほか、薬量の間違いも要因となる。"},{"no":135,"text":"糖尿病治療中に低血糖をきたす要因として、食事の量がいつもより少ない、運動量がいつもより多い、アルコールの摂取量がいつもより多いなどがある。"},{"no":136,"text":"糖尿病の傷病者が、感冒や急性胃腸炎などによって、食欲低下、発熱、嘔吐、下痢などをきたし、食事が摂れない場合やその期間をシックディと呼ぶ。"},{"no":137,"text":"糖尿病の傷病者やその家族は、低血糖を自覚した場合には１０ｇ程度のブドウ糖タブレットやゼリー製剤などの摂取を主治医から指導されていることが多い。"},{"no":138,"text":"低血糖を自覚した場合で、内服が出来ない場合に備え、グルカゴン点鼻粉末剤（バクスミー）を処方されている場合もある。"},{"no":139,"text":"救急の現場で低血糖症を疑った場合は、ブドウ糖摂取やグルカゴン製剤の使用の有無、使用時刻について確認する。"},{"no":140,"text":"グルカゴン製剤を使用していた場合、医師が使用済みの容器をもとにその投与状況を確認するため、使用済みの容器を傷病者とともに搬送する。"},{"no":141,"text":"低血糖による意識障害（JCS10以上を目途）を疑う場合には、血糖測定器を用い血糖値を測定する。50mg/dL未満であれば、オンラインMC医師の指示に従いブドウ糖溶液を投与する。"},{"no":142,"text":"ブドウ糖溶液投与にも関わらず意識レベルが速やかに改善しない場合は、①低血糖以外にも意識障害をきたす原因がある、②低血糖状態が長時間続いたために脳が高度の障害を受けていることを考慮する。"},{"no":143,"text":"糖尿病ケトアシドーシスの多くは1型糖尿病にみられ、感染症、外傷、ストレスなどを契機にインスリンの作用が極度に不足して生じる場合がある。"},{"no":144,"text":"糖尿病ケトアシドーシスの症候として、浸透圧利尿による多尿、脱水のため口渇、多飲、悪心・嘔吐、腹痛を訴え、低血圧、頻脈を認める。"},{"no":145,"text":"糖尿病ケトアシドーシスは、速く深い規則正しい呼吸（クスマウル大呼吸）が特徴的であり、呼気は甘酸っぱいフルーツ様のアセトン臭を呈する。"},{"no":146,"text":"高浸透圧高血糖症候群は、２型糖尿病患者に多くみられ、中高年に多い。感染や、利尿薬の使用などによる脱水などがきっかけとなる。"},{"no":147,"text":"高浸透圧高血糖症候群は、著しい高血糖となり、浸透圧利尿・脱水をきたす。脱水の程度は糖尿病ケトアシドーシスよりも高度であり、時にショック状態となる。"},{"no":148,"text":"高浸透圧高血糖症候群では、さまざまな程度の意識障害を認め、失語、けいれんなど多彩な神経症候を生じる。"},{"no":149,"text":"意識障害の原因は多岐にわたり複数の原因が関与するが、一次性脳病変と二次性脳病変に大別される。"},{"no":150,"text":"意識障害をきたす疾患の鑑別には、「AIUEOTIPS」や「意識に障害、なるほどまずい、試して酸素」などの覚え方が活用される。"},{"no":151,"text":"既往歴に糖尿病があった場合、推測される意識障害の病態として、低血糖、糖尿病ケトアシドーシス、高浸透圧高血糖症候群がある。"},{"no":152,"text":"ショックは意識障害の原因の一つである。"},{"no":153,"text":"項部硬直は、髄膜炎やくも膜下出血などで髄膜が刺激された際に出現する症候である。"},{"no":154,"text":"くも膜下出血の出血初期では、項部硬直を認めないこともある。また、項部硬直の評価は痛み刺激となるため、くも膜下出血を疑う場合は慎重に実施する必要がある。"},{"no":155,"text":"血糖測定器の環境温度は適正範囲を超えると、測定値に誤差が生じる（実際の値より低くなる）ことがある。"},{"no":156,"text":"血糖測定の目的は、低血糖による意識障害とそれ以外の意識障害の判断を行い、適切な処置および医療機関の選定を行うことである。"},{"no":157,"text":"血糖測定の穿刺部位は中指、環指などの手指を原則とする。"},{"no":158,"text":"血糖測定の際、穿刺器具の先端を穿刺部の皮膚にしっかりと密着させて穿刺する。"},{"no":159,"text":"血糖測定の際、穿刺後、測定に必要な出血が得られない場合には、穿刺部の周囲をうっ血させる。指尖部を穿刺後は、指の付け根から指先に向けて全体をしぼり出す。"},{"no":160,"text":"指尖部で穿刺する場合、指腹より爪脇のほうが間質液の混入がないため、正確な値が得られやすい。"},{"no":161,"text":"穿刺時の腕の逃避反応には十分注意する。"},{"no":162,"text":"血糖値の測定結果が５０mg/dL未満であった場合、静脈路確保とブドウ糖投与のプロトコールに基づき、医師からの指示を求める。"},{"no":163,"text":"血糖値の測定結果が５０mg/dL以上であれば、通常の意識障害の傷病者に対する活動を行う。"},{"no":164,"text":"血糖測定を試みた場合は、血糖値の如何にかかわらず、医師に血糖測定の実施とその結果などを報告する。"},{"no":165,"text":"ブドウ糖溶液投与中は意識レベルの変化に注意する。全量（合計40ｍＬ)投与を原則とするが、医師の指示により減量してもよい。"},{"no":166,"text":"ブドウ糖溶液投与中は、ほかの隊員に静脈路確保側の上肢、または頭部・肩を保持させる。"},{"no":167,"text":"ブドウ糖溶液投与後、意識が回復した際に不穏状態となり体動が激しくなる場合がある。"},{"no":168,"text":"ブドウ糖溶液の投与によって意識レベルがＪＣＳⅠ桁まで改善したとしても、搬送中などに再び意識レベルが低下する場合がある。"},{"no":169,"text":"５０％ブドウ糖注射液は、生理食塩液の約１２倍の浸透圧を有している。"},{"no":170,"text":"５０％ブドウ糖注射液は、血管内投与時に強い血管痛を伴うことがある。"},{"no":171,"text":"５０％ブドウ糖注射液は、血管外漏出時は強い組織障害性を示す。"},{"no":172,"text":"医療事故とは、医療にかかわる場所で医療の全過程において発生する人身事故いっさいを包含し、医療従事者が被害者である場合や、「廊下で転倒した」など医療行為とは直接関連しない場合も含む。"},{"no":173,"text":"医療過誤とは、医療事故のうち医療者の過失によって生じた患者に不利益をもたらした事故である。"},{"no":174,"text":"リスクマネジメントは安全管理を具体的に実践する手法であり、事故を未然に防ぐ予防対策のみならず、発生時の緊急対応や再発防止体制の構築までを包含するものである。"},{"no":175,"text":"「人はエラーを犯すもの」との認識のもと、個々人が慎重な業務遂行に努める必要がある。"},{"no":176,"text":"ヒューマンエラーの完全な排除は不可能との前提に立ち、個人の注意力や努力に依存せず、エラーを防ぐ仕組みづくりとバックアップ体制の構築も重要である。"},{"no":177,"text":"インシデントとは、何らかのミスや予期せぬ事態が発生することにより傷病者に対して害を及ぼす可能性があったが、実際には損害やけがに至らなかった事象をさす。"},{"no":178,"text":"ヒヤリハットとインシデントは、ほぼ同じ意味を表す用語として用いられる。"},{"no":179,"text":"アクシデントとは、医療過誤や処置中の事故などにより、実際に傷病者に対して健康被害やけがをもたらした事象をさす。"},{"no":180,"text":"インシデントやアクシデントが発生した際には、それらを詳細に記録し原因を分析することで再発防止を講じることができる。"},{"no":181,"text":"薬剤の誤投与をしないように医療機関では、医師がオーダリングシステムに入力し、その内容を看護師などのメディカルスタッフがダブルチェックを行い、間違いがないか確認する。"},{"no":182,"text":"救急救命士の「指示要請」は、主に携帯電話で行われるが、無線が用いられることもある。口頭でのコミュニケーションとなるため、エラーが生じる可能性がある。"},{"no":183,"text":"救急救命士が特定行為を実施する際、指示を受けた内容、使用する薬剤などに間違いがないかダブルチェックをすることが大切である。"},{"no":184,"text":"ダブルチェックは２人で同じ内容をチェックし合う方法と、１人で確認方法を変えて２回チェックする方法がある。"},{"no":185,"text":"薬剤の誤投与には十分に注意する必要があるが、投与する際には与薬の６Ｒを意識するとよい。"},{"no":186,"text":"与薬の６Ｒとは、正しい傷病者、正しい薬物、正しい目的、正しい用量、正しい方法、正しい時間のことを言う。"},{"no":187,"text":"心肺機能停止前の静脈路確保及び輸液について、少なくとも意思疎通が可能な傷病者には処置を行う前に適切な説明により理解と同意を得なければならない。"},{"no":188,"text":"心肺機能停止前の静脈路確保の実施については、救急車内で実施することを優先する。"},{"no":189,"text":"アナフィラキシーショックでは、エピペンの処方・所持を確認し、傷病者本人が使用できない場合は、速やかにエピペンを使用する。"},{"no":190,"text":"アナフィラキシーショックでエピペンを使用してもショック症状が改善されなければ、心肺停止前の静脈路確保と輸液へ移行する。"},{"no":191,"text":"「心肺停止前静脈路確保と輸液」は特定行為であり、医師の具体的指示を必要とする。"},{"no":192,"text":"血糖を測定した結果、５０mg/dLだった場合は、救急救命士による静脈路確保とブドウ糖投与には該当しない。"},{"no":193,"text":"ブドウ糖投与後の再血糖測定は、医師の具体的指示である。"},{"no":194,"text":"熱中症などによる脱水の場合も、心肺停止前の静脈路確保の対象である。"},{"no":195,"text":"輸液について、５００ml毎に医師へ報告し指示を受けること。"},{"no":196,"text":"説明と同意が取得困難な状況で、かつ家族などの代諾者がいない場合であって、救急救命士がその知識や倫理観に基づいて処置が必要と判断した場合は、リスボン宣言主旨に則って同意があるものとみなして扱うこととなる。"},{"no":197,"text":"静脈路確保を実施する際は、穿刺の試行は１回９０秒以内を目途とし穿刺回数は原則２回までとする。"},{"no":198,"text":"心肺停止前の静脈路確保を実施する場合の現場活動時間は、傷病者接触から現場離脱まで１０分程度とする。"},{"no":199,"text":"静脈路確保の際、静脈が触認できない場合には実施しない。"},{"no":200,"text":"ブドウ糖の静注について、５０％ブドウ糖溶液４０mlを原則とする。"},{"no":201,"text":"ブドウ糖溶液投与後、約３分後の意識レベルの評価を慎重に行う。"},{"no":202,"text":"事前管制、消防隊支援が必要な傷病者は、呼びかけて肩をたたいて反応がない傷病者、冷汗を伴う胸痛・呼吸困難、その他重篤と疑われるものの傷病者である。"}]},"intubation":{"name":"気管挿管試験","icon":"🫁","items":[{"no":1,"text":"生命倫理の「４つの原則」（米国由来）には「自律の尊重」「善行の原則」「無危害の原則」「公正・正義の原則」がある。"},{"no":2,"text":"リスボン宣言における患者の主要な権利として、①良質な医療を受ける権利、②選択の自由についての権利、③自己決定の権利、④情報を得る権利、⑤秘密保持を得る権利、⑥健康教育を受ける権利、⑦尊厳を得る権利、⑧宗教的支援を受ける権利　等がある。"},{"no":3,"text":"ACPとは、傷病者が自らの将来において生じる可能性に備えて将来受けるであろう医療およびケアの内容について、傷病者を主体に、家族や近しい人、現在かかわっている医療・ケアチームが、繰り返し話し合いを行い、傷病者の意思決定を支援するプロセスである。"},{"no":4,"text":"救急救命士の職業倫理には、「日常業務における救急救命士の責務」と「救急救命士が個々人として研鑽すべき責務」があり、「医学知識・技術の習得」は後者に該当する。"},{"no":5,"text":"救急救命士の資格者は、医師の指示の下に、病院や診療所への搬送中や到着後から入院までの間に、救急救命処置を実施できる。"},{"no":6,"text":"メディカルコントロール（MC）とは、医学的な質を保障（障害なく守る）する取り組みを継続的、組織的に行う体制である。"},{"no":7,"text":"メディカルコントロール体制でも取り上げられているＰＤＣＡサイクルとは、Plan（プロトコールの策定）、Do（医師の指示、指導・助言体制）、Check（事後検証の実施）、Act（再教育体制の整備）である。"},{"no":8,"text":"メディカルコントロールの方法として、①指示、指導・助言　②事後検証　③教育・研修があげられる。これらは「MCの３本柱」と呼ばれる。"},{"no":9,"text":"オンラインメディカルコントロールは、現場で活動する救急救命士などが、医療機関や消防機関の通信指令室などにいる医師から、携帯電話などを通じてリアルタイムで指示、指導・助言受けること、あるいは、医師が救急救命士などに指示、指導・助言を行うことをいう。"},{"no":10,"text":"オフラインメディカルコントロールにはプロトコールによる指示、指導・助言、事後検証、教育が該当する。"},{"no":11,"text":"地域メディカルコントロール協議会が行う役割に、地域の医療機関と消防機関の連絡調整等がある。"},{"no":12,"text":"救急活動記録票は、検証の資料となるほか裁判資料として使われる場合もあるため、十分な正確性と客観性が求められる。"},{"no":13,"text":"「救急業務実施基準」より、救急隊員は救急活動を行った場合、救急活動記録票を作成することとされている。"},{"no":14,"text":"医師からの指示であっても、救急救命士は厚生労働省の定める救急救命処置の範囲を超えて処置を行うことはできない。また、プロトコールに定められた制限にも従う必要がある。"},{"no":15,"text":"DNAR指示は心停止時のみに有効であり、それ以外の医療やケア（心肺蘇生の場合以外に対して行われる通常の医療・看護行為）に影響を与えるものではない。"},{"no":16,"text":"救急救命士が行う、気管内チューブによる気道確保の対象者は心肺機能停止および呼吸機能停止の状態である。"},{"no":17,"text":"救急救命処置録は、「その記載の日から５年間、これを保存しなければならない」と定められている。"},{"no":18,"text":"救急救命士は「保健師助産師看護師法の規定にかかわらず、診療の補助として救急救命処置を行うことを業とすることができる」（救急救命士法第４３条）"},{"no":19,"text":"血中の酸素は組織で細胞に渡りミトコンドリアで利用されて好気性代謝を担う。"},{"no":20,"text":"気道とは口腔、鼻腔に始まり咽頭、喉頭、気管を通過し、気管支、細気管支へと分岐を繰り返し、およそ第１６分岐の終末細気管支までの経路をいう。"},{"no":21,"text":"気道は鼻腔から喉頭までの上気道と気管から抹消の下気道に区分される。"},{"no":22,"text":"気道部分として気管、気管支、細気管支、終末細気管支があり、気道およびガス交換部分として呼吸細気管支、肺胞洞、肺胞嚢がある。"},{"no":23,"text":"鼻腔は板状の鼻中隔で左右に分離され、側壁に上鼻甲介、中鼻甲介、下鼻甲介が３段に突出している。"},{"no":24,"text":"口腔の上壁の前方約2/3は骨性部の硬口蓋、後方約1/3は筋性部の軟口蓋である。"},{"no":25,"text":"軟口蓋の後方部には突起状に垂れ下がった口蓋垂がある。"},{"no":26,"text":"開口して奥を覗くと正面に口蓋垂と、これに連なる口蓋弓が弓状の２つのヒダとしてみえる（口蓋舌弓と口蓋咽頭弓）。その間のくぼみには口蓋扁桃（いわゆる扁桃腺）の一部が見える。"},{"no":27,"text":"舌は口腔底に付着する大きな筋肉のかたまりであり、意識障害によっては弛緩して舌根沈下を起こして上気道閉塞をきたす。"},{"no":28,"text":"咽頭は後鼻孔と口腔が喉頭・食道に移行する部分で、咽頭鼻部（上咽頭）、咽頭口部（中咽頭）、咽頭喉頭部（下咽頭）に大別される。"},{"no":29,"text":"切歯から喉頭までの距離は成人で12ｃｍ～13ｃｍである。"},{"no":30,"text":"喉頭は第４、５、６頸椎の前方に位置している。"},{"no":31,"text":"喉頭は主に４種の軟骨（甲状軟骨、輪状軟骨、喉頭蓋軟骨、披裂軟骨）で形成される。"},{"no":32,"text":"声帯ヒダに挟まれた空気の通り道を声門（裂）と呼ぶ。"},{"no":33,"text":"喉頭部分の長さは成人で3～4ｃｍである。"},{"no":34,"text":"輪状甲状間膜（靭帯）は上気道閉塞時の緊急気道確保時に穿刺、切開を行う部位である。"},{"no":35,"text":"喉頭蓋は嚥下時に反射的に閉じることにより、気道への誤嚥を予防している。"},{"no":36,"text":"下気道は、輪状軟骨から気管分岐部に至るまでの気管とそれより抹消の気管支に分けられる。"},{"no":37,"text":"気管は第６頸椎の高さから始まり、食道前面を正中線に沿って下行し縦隔に入る。"},{"no":38,"text":"気管は、およそ第４～６胸椎の高さで左右の気管支に分かれる。"},{"no":39,"text":"成人の右主気管支は、長さが約２ｃｍで、正中線に対する角度は20～25°（小児では約30°）である"},{"no":40,"text":"成人の左主気管支は、長さが約５ｃｍで、正中線に対する角度は40～45°（小児では約47°）である。"},{"no":41,"text":"気管挿管時にチューブを深く入れると右主気管支に入りやすい。"},{"no":42,"text":"右主気管支は、肺門で上方へ向かう右上葉気管支と、下方への右中葉気管支と下葉気管支に分かれる。"},{"no":43,"text":"左主気管支は、大動脈弓の後ろで胸部大動脈の前を通過して左上・下葉気管支に分かれる。"},{"no":44,"text":"気管・気管支は筒型であり前部と側部はU型の軟骨で形成され、後部は軟骨がなく膜様部（膜性壁）と呼ばれ、食道の前壁と接している。"},{"no":45,"text":"気管は後方からの圧迫に弱く脊椎損傷などで血腫ができると気管膜様部を圧迫して窒息することがある。"},{"no":46,"text":"気管・気管支の内腔表面は粘膜で覆われ、無数の線毛が生えている。"},{"no":47,"text":"１歳までは鼻呼吸であるため、鼻閉は換気障害の原因になる。"},{"no":48,"text":"小児の喉頭は第３～第４頸椎の高さにあって成人よりも高く、また前寄りの位置にある。"},{"no":49,"text":"小児は成人に比べて喉頭蓋は相対的に長く、水平位であり、頭側から覗いたときΩ型を呈し硬くしなやかさがない。"},{"no":50,"text":"吸入された空気は上気道を通過していくうちに気道粘膜により加温・加湿され、気管分岐部付近でほぼ37℃、湿度100％になる。"},{"no":51,"text":"胸郭は脊柱、肋骨、胸骨からなる骨組織で、底面は横隔膜である。"},{"no":52,"text":"胸郭と横隔膜に囲まれる腔を胸腔といい、肺、気管・気管支、心臓、大血管、食道などを容れる。"},{"no":53,"text":"横隔膜には、食道裂孔、大動脈裂孔、大静脈孔が存在する。"},{"no":54,"text":"肺は縮む性質をもち、胸郭は外へ広がる性質を有している。"},{"no":55,"text":"胸腔内圧は、吸気時は－4～－8ｃｍH2O、呼気時には約－2～－4ｃｍH2Oである。"},{"no":56,"text":"安静時の吸気量は70％が横隔膜の機能による。"},{"no":57,"text":"横隔膜は吸気時に収縮し、呼気時に弛緩している。"},{"no":58,"text":"肋間筋は胸髄（第1～11）からの肋間神経、横隔膜は頚髄（第3～5）からの横隔神経で支配される。"},{"no":59,"text":"右肺は三葉、左肺は二葉に分離しており、左右の胸膜腔にそれぞれ包まれている。"},{"no":60,"text":"縦隔の中央には心臓があり左側に膨らんでいるため、左肺は右肺に比してやや小さい。"},{"no":61,"text":"気管支は次々と分岐し、第17分岐の呼吸細気管支より抹消が肺胞であり、肺胞数は３億個、肺胞の１つの大きさは直径0.2mm程度である。"},{"no":62,"text":"Ⅱ型肺胞細胞からは表面活性物質（サーファクタント）が分泌されており、球形の肺胞が表面張力で虚脱するのを防止している。"},{"no":63,"text":"肺胞壁と肺毛細血管の間は間質と呼ばれ、その厚さは約0.5μmである。"},{"no":64,"text":"気管支動脈は肋間動脈、もしくは胸部大動脈より分岐している。"},{"no":65,"text":"肺と気管支の神経支配は迷走神経および交感神経である。"},{"no":66,"text":"肺胞内での肺胞気と肺毛細血管の間の酸素の取り込みと二酸化炭素の排出は、各々の分圧差（濃度差）に伴う物理的な拡散現象によって行われる。"},{"no":67,"text":"気道を経由して肺胞までにたどり着く空気の酸素分圧は150mmHgである。"},{"no":68,"text":"肺胞内の酸素は、肺胞の壁（肺胞上皮細胞）⇒肺胞を形作る基底膜⇒間質⇒血管の壁（毛細血管内皮細胞）　という順に移動（拡散）して血漿（液体）と接する。"},{"no":69,"text":"肺胞中では約100ｍｍHgあった酸素分圧は血漿中では約95mmHgとなる。"},{"no":70,"text":"二酸化炭素の大部分は、血液中では炭酸水素イオンとして運ばれ、体内では「CO２ + H2O ⇔ H2CO3　⇔　H+ + HCO3-」という関係が成り立ち平衡を保っている。"},{"no":71,"text":"混合静脈血の二酸化炭素分圧は46ｍｍＨｇである。"},{"no":72,"text":"換気血流比は、肺胞換気量（L/分）/肺循環血液量（L/分）という式で表される。"},{"no":73,"text":"換気血流比は１に近いほど理想的であるが、体位や肺の部位でもその値は異なり、全体としての正常値は約0.8である。"},{"no":74,"text":"ヘモグロビンは赤血球内に存在する鉄を含む蛋白質で、成人男子で血液100ｍL当たり15ｇのヘモグロビンが存在し、1ｇのヘモグロビンは1.34ｍLの酸素を結合することができる。"},{"no":75,"text":"酸素解離曲線に見れられる特性は、酸素分圧（PO2）≦60ｍｍHgでは酸素飽和度（SO2）は急激に低下し、組織への酸素運搬量は著明に減少する現象である。"},{"no":76,"text":"臓器（組織）の毛細血管内の血漿の酸素分圧は40ｍｍHg程度であり、酸素飽和度はおよそ75％程度になる。"},{"no":77,"text":"アシドーシス、体温上昇では酸素解離曲線が通常の位置より右へ移動する。"},{"no":78,"text":"呼吸運動は意識下（随意）でも行われるが、ほとんど無意識（不随意）で行われている。"},{"no":79,"text":"不随意的な呼吸は、ほぼ一定のリズムで行われ、この調節は橋から延髄に存在する呼吸中枢によって営まれる。"},{"no":80,"text":"末梢化学受容体は頸動脈小体と大動脈小体がある。"},{"no":81,"text":"随意的呼吸運動は大脳皮質にその中枢がある。"},{"no":82,"text":"歯は歯冠、歯頸、歯根の３部で構成、歯冠は硬いエナメル質で覆われており、このエナメル質は欠損すると再生されない。"},{"no":83,"text":"成人では切歯（２本）、犬歯（１本）、小臼歯（２本）、大臼歯（３本）の８本が上下左右に順列して合計３２本の永久歯を有している。"},{"no":84,"text":"大唾液腺と小唾液腺があり、大唾液腺には耳下腺・顎下腺・舌下腺がある。"},{"no":85,"text":"咽頭筋の収縮で咽頭が上方に引き上げられると喉頭が閉鎖され、食物は気管に入らず食道に移行していく。"},{"no":86,"text":"嚥下の際は、喉頭が持ち上がり喉頭蓋が気管の入口に密着し、気管に食物が入らなくなると同時に口蓋垂が持ち上がり鼻腔と隔離されるため、食物は食道に入る。"},{"no":87,"text":"食道は咽頭から胃に通じる長さ約25ｃｍ（成人）の管であり、起始部である食道入口部は第６頸椎の高さに相当する。"},{"no":88,"text":"食道は気管背側の後縦隔を下行し、食道裂孔で横隔膜を貫通し噴門で胃に移行する。"},{"no":89,"text":"食道は口側から食道起始部・気管分岐部・食道裂孔部の３カ所が食道の生理的狭窄部として知られており、それぞれの狭窄部で食物や異物が停滞しやすい。"},{"no":90,"text":"食物が咽頭から食道に入ると蠕動運動が活発となり、下部食道括約筋が弛緩して噴門が開き、食物は胃に運ばれる。"},{"no":91,"text":"胃は食道につながる入口部から噴門・胃底部・胃体部・幽門（前庭）部・幽門を経て、十二指腸に移行する。"},{"no":92,"text":"食物の胃内停滞時間は2～4時間であり、胃腺からは胃液が1日に約1～1.5L分泌される。"},{"no":93,"text":"第Ⅸ脳神経（舌咽神経）は迷走神経とともに咽頭筋・喉頭筋を支配しており、口蓋・咽頭の感覚を司っている。"},{"no":94,"text":"トリプルエアウエイマニューバーは開口、下顎挙上、頭部後屈の３つを併用し、気道の開通を図る方法である。"},{"no":95,"text":"乳児の気道確保時の注意点として、気道確保時に口腔底軟部組織を圧迫すると、気道開通の妨げとなる。"},{"no":96,"text":"経口（口咽頭）エアウエイの適応は意識障害（JCS200以上を目安）があり、咽頭反射が消失しており、舌根沈下による気道狭窄症状がみられるときに用いる。"},{"no":97,"text":"経鼻（鼻咽頭）エアウエイの適応は意識障害による舌根沈下などで、気道が狭窄または閉塞した傷病者に用いるが、咽頭反射がある傷病者でも使用可能である。"},{"no":98,"text":"腹部突き上げ法は上腹部を圧迫し横隔膜を挙上させることで、胸腔内圧の上昇を図り、上気道の異物を除去する方法であるが、乳児、妊婦、極度の肥満者には禁忌である。"},{"no":99,"text":"妊婦や高度の肥満の傷病者に対しては、腹部突き上げ法の代わりに胸部突き上げ法を行う。"},{"no":100,"text":"喉頭周囲にカフを当て気管へ空気を流入させるタイプの声門上気道デバイスには、ラリンゲアルマスク、i-gelⓇ（アイジェル）がある。"},{"no":101,"text":"食道と咽頭をカフで閉鎖し、食道から胃への空気の流入を遮断して気管へ送気するタイプの声門上気道デバイスには、ラリンゲルチューブⓇがある。"},{"no":102,"text":"声門上気道デバイスを用いた気道確保の適応は呼吸機能停止または心臓機能停止の傷病者である。"},{"no":103,"text":"ラリンゲアルマスクの挿入方法として、マスクの先端を硬口蓋に押し当てるようにして、正中線に沿って指が届くところまで挿入し、チューブを持ち替え、抵抗を感じるところまで挿入する。"},{"no":104,"text":"ラリンゲアルマスクのサイズ３における、適応体重の目安は30～50Kgの小児/成人であり、サイズ４における適応体重の目安は50～70Kgの成人である。"},{"no":105,"text":"ラリンゲアルマスクは食道を閉鎖する機能が食道閉鎖式エアウエイほど十分ではないので、胃内容物の逆流や、誤嚥の可能性を常に念頭に置いて観察する必要がある。"},{"no":106,"text":"ラリンゲアルマスクはカフと粘膜との間の気密性はそれほど高くないため、高い圧で送気するとカフ周辺からの漏れが起こる。"},{"no":107,"text":"i-gelⓇ（アイジェル）の喉頭周囲を覆う非膨張性マスクはゴム様ゲル素材でできており、カフを空気で膨らませる必要がない。"},{"no":108,"text":"i-gelⓇ（アイジェル）は新生児から成人用まで７種類のサイズがあり、サイズ３の適応体重は30～60Kgである。"},{"no":109,"text":"i-gelⓇ（アイジェル）はカフの背面、両側面及び前部に水溶性の潤滑剤を塗布する。"},{"no":110,"text":"i-gelⓇ（アイジェル）の挿入方法として、バイトブロックの部分を把持し、硬口蓋に沿って挿入し、抵抗があれば用手気道確保を加えながら、またはカフ先端を少し回転させながら挿入する。"},{"no":111,"text":"ラリンゲアルチューブⓇはチューブ先端の食道カフで食道を閉鎖し、咽頭カフで咽頭部を塞ぐことにより、その中間に設けた換気口を通して気管への換気を行う。"},{"no":112,"text":"ラリンゲアルチューブⓇは新生児から成人まで７種類のサイズがある。"},{"no":113,"text":"ラリンゲアルチューブⓇのサイズ３は適応身長が155ｃｍ未満であり、カラーは黄色である。サイズ４は適応身長155～180ｃｍでカラーは赤である。"},{"no":114,"text":"ラリンゲアルチューブⓇを挿入する際には傷病者をスニッフィングポジションもしくは中間位にする。"},{"no":115,"text":"ラリンゲアルチューブⓇの挿入方法として、下顎と舌を持ち上げ、硬口蓋に押し当て挿入し、口蓋に沿ってチューブを下咽頭に進め、門歯がティースマークに位置するまで挿入する。"},{"no":116,"text":"ラリンゲアルチューブⓇの先端が咽頭後壁粘膜に垂直に近い角度で接触した状態で無理に挿入したことで、咽頭後壁を損傷したという報告もある。"},{"no":117,"text":"喉頭鏡とマギール鉗子により除去できるのは、咽頭から声門までの異物である。"},{"no":118,"text":"喉頭鏡による喉頭展開で異物を確認したら異物から目を離さないようにマギール鉗子のリングハンドルに母指と環指を入れ把持する。"},{"no":119,"text":"喉頭鏡とマギール鉗子で異物除去する際は、口角横からマギール鉗子を挿入し、先端で異物を把持して除去する。"},{"no":120,"text":"喉頭鏡とマギール鉗子の使用により、歯牙や口腔内粘膜などの損傷を生じることがあり、とくに３歳以下の小児に対して使用するときには留意する。"},{"no":121,"text":"気道異物とは、通常、咽頭・喉頭から気管支までの異物をいう。"},{"no":122,"text":"高齢者では咽頭・喉頭異物（上気道異物）が多く、乳幼児では気管・気管支異物（下気道異物）が多い。"},{"no":123,"text":"気道異物の種類として、高齢者では餅が多く、小児ではピーナッツなどの豆類、飴、小玩具など、口に入るものすべてが気道異物の原因となる。"},{"no":124,"text":"咽頭や喉頭などの上気道の異物では聴診で吸気時喘鳴を認め、シーソー呼吸、陥没呼吸などの胸郭運動異常を生じる。"},{"no":125,"text":"胸腔内気管異物では聴診で呼気時喘鳴を認め、シーソー呼吸、陥没呼吸などの胸郭運動異常を生じる。"},{"no":126,"text":"気管支（下気道）異物では呼気困難となり、聴診で笛声音（ウィーズ）、いびき音（ロンカイ）を認め、胸郭運動の左右差などの胸郭運動異常を生じる。"},{"no":127,"text":"高齢者や小児では、無気肺や肺炎を起こして初めて気管支異物に気づく場合もある。"},{"no":128,"text":"小児のピーナッツによる気管・気管支異物では、重篤な喘息発作を生じる場合がある。"},{"no":129,"text":"背部叩打、腹部突き上げ、胸部突き上げを行っているうちに傷病者が意識を失った場合は、仰臥位にして直ちに胸骨圧迫を開始するが、心停止による適応ではないため脈の触知を行う必要はない。"},{"no":130,"text":"気道の不完全閉塞で気管支（下気道）および気管の小さな異物における緊急度は「低」である。"},{"no":131,"text":"気道の不完全閉塞で咽頭・喉頭（上気道）および気管の比較的大きな異物は緊急度「中」である。"},{"no":132,"text":"気道の完全閉塞で咽頭・喉頭（上気道）および気管の大きな異物は緊急度「高」である。"},{"no":133,"text":"救急救命士が行う気管挿管の適応は、心臓機能停止状態かつ呼吸機能停止状態の傷病者である。"},{"no":134,"text":"気管内チューブのサイズは、男性で７.５ｍｍまたは８.０ｍｍ、女性で７.０ｍｍが標準サイズである。"},{"no":135,"text":"気管挿管時における準備では、カフに空気を注入し、変形と空気漏れがないかを確認する。"},{"no":136,"text":"気管挿管時における準備では、カプノメーターを点検する必要があるが、カプノメーターを使用しない場合は、呼気二酸化炭素検出器の色調が紫色であることを確認する。"},{"no":137,"text":"気管挿管時における準備では、スタイレットを滅菌バックに入れたまま気管内チューブの形状に合わせる。"},{"no":138,"text":"気管挿管時における準備では、スタイレットの先端が気管内チューブの先から出ないように調整する。"},{"no":139,"text":"気管挿管を実施する際、傷病者の頭に高さ8～10cmの枕を敷きスニッフィングポジションをとる。"},{"no":140,"text":"スニッフィングポジションは口腔軸、咽頭軸、喉頭軸が互いに平行に近づくため、声門を直視しやすくなる。"},{"no":141,"text":"気管挿管を実施する際、左手に持った喉頭鏡のブレードを右口角から挿入し、舌を左に圧排しながら奥へ進め、ブレードの先端が喉頭蓋谷に到達したら、喉頭蓋を持ち上げる。"},{"no":142,"text":"コーマック分類は喉頭展開時の喉頭の見え方を４段階に分類している。"},{"no":143,"text":"コーマックグレード１は声門のすべてが視認できる状態である。"},{"no":144,"text":"コーマックグレード２は声帯の後部と後部軟骨群が視認できる状態である。"},{"no":145,"text":"コーマックグレード３は喉頭蓋のみが視認できる状態である。"},{"no":146,"text":"コーマックグレード４は舌根部のみが視認できる状態である。"},{"no":147,"text":"ＢＵＲＰ法とは、右手で甲状軟骨を背側、頭側、右方に圧迫することにより、声門部の視野を得やすくする方法である。"},{"no":148,"text":"気管挿管を実施する際、声門の視野を妨げないように右の口角から気管内チューブを正中に対し約45°の角度で挿入する。"},{"no":149,"text":"気管挿管を実施する際、気管内チューブ先端を声門入口まで進め、胸骨圧迫を中断し、気管内チューブの先端が確実に声門を通過後、スタイレットを抜去する。"},{"no":150,"text":"気管挿管を実施する際、目視で気管内チューブのカフ近位端が声門の1～2cm超えるまで気管内チューブを進める。"},{"no":151,"text":"気管挿管を実施する際、気管内チューブの深さを門歯の位置にあるチューブの目盛りで確認する（男性：約20～24cm、女性：約19～22cm）"},{"no":152,"text":"気管挿管を実施後、胸骨圧迫を中断し、胸部の挙上を視覚的に確認するとともに、聴診にて心窩部のゴボゴボ音の有無、および両肺野での肺胞音を確認する。"},{"no":153,"text":"気管挿管下に胸骨圧迫を非同期で行う場合は人工呼吸の回数が推奨値の１０回/分を大きく上回らないよう注意する。"},{"no":154,"text":"CPR実施中、過換気による胸腔内圧の上昇は、圧迫解除時に期待する静脈還流を妨げ、心拍出量を減少させる."},{"no":155,"text":"理想的条件下の胸骨圧迫における、肺血流量は正常安静時の約30％である。"},{"no":156,"text":"理想的条件下の胸骨圧迫における、冠血流量は正常安静時の5～35％である。"},{"no":157,"text":"理想的条件下の胸骨圧迫における、脳血流量は正常安静時の30～40％である。"},{"no":158,"text":"気管挿管困難症例のもっとも多い原因は、顎関節機能障害による開口障害である。"},{"no":159,"text":"用手法による気道確保と換気にもかかわらず、通常より胸郭の膨らみが悪い場合、気管挿管困難症例であることが予測される。"},{"no":160,"text":"開口の程度、下顎から舌骨間距離、甲状軟骨から胸骨上窩の距離が、それぞれ３横指より狭い場合、挿管困難予測の、「３の法則」という。"},{"no":161,"text":"上顎の前方への著しい突出、極端な小顔、咽頭・喉頭部の形態異常、猪首、短頸は気管挿管困難症例であることが予測される。"},{"no":162,"text":"気管吸引時の吸引圧は概ね100ｍｍＨｇ前後が推奨されるが、粘調度の高い分泌物であればより高い圧（150ｍｍHｇ程度）を要する場合もある。"},{"no":163,"text":"気管吸引時、吸引チューブの先端が気管内チューブの内壁以外に触れないよう挿入し、先端が突き当たれば気管分岐部なので気管内チューブ内へ引き戻す。"},{"no":164,"text":"気管吸引の注意点として、清潔を保つ必要がある。"},{"no":165,"text":"気管吸引の注意点として、吸引前に十分な酸素化を行う。"},{"no":166,"text":"気管吸引の注意点として、吸引時間は短時間に行う。"},{"no":167,"text":"気管吸引時の注意点として、吸引チューブの外径は気管内チューブの内径の５０％を超えないようにする。"},{"no":168,"text":"【プロトコール】器具による気道確保実施における胸骨圧迫の中断時間は１０秒以内とする。"},{"no":169,"text":"【プロトコール】声門上気道デバイスで換気良好の場合はCPRを非同期で行い、人工呼吸は１回１秒で約１０回/分で実施する。"},{"no":170,"text":"【プロトコール】器具を用いた気道確保で換気不良の場合は、ＢＶＭによる換気状況を医師に報告するとともに指示を求める。"},{"no":171,"text":"【プロトコール】声門上気道デバイスで換気良好な場合と気管挿管した場合の胸骨圧迫実施回数は同じである。"},{"no":172,"text":"【プロトコール】声門上気道デバイスで換気良好な場合と気管挿管した場合の人工呼吸実施回数は同じである。"},{"no":173,"text":"【プロトコール】気道確保器具による気道確保手技は１ピリオド内で行う。"},{"no":174,"text":"【プロトコール】気道確保器具による気道確保を行った場合は、直ちに連続的呼気終末二酸化炭素(ETCO2)モニターを装着する。"},{"no":175,"text":"【プロトコール】ETCO2の低値は、気道が確保されていない（気管チューブの気管からの逸脱、声門上気道デバイスが正しく留置されていない）、あるいは胸骨圧迫が不十分であることを示唆するので対処する。"},{"no":176,"text":"【プロトコール】心拍再開後、ETCO2の値が徐々に低値になってきている場合は、血圧の低下を意味する。"},{"no":177,"text":"【プロトコール】気管挿管適応条件のひとつは、心停止かつ呼吸停止である。"},{"no":178,"text":"【プロトコール】初期波形が目撃のない心静止の場合は気管挿管の適応ではない。"},{"no":179,"text":"【プロトコール】気管挿管適応条件のひとつは傷病者が１５歳以上である。"},{"no":180,"text":"【プロトコール】気管挿管プロトコールにおける声門の確認とは全体が視認できる状態をいう。"},{"no":181,"text":"【プロトコール】気管挿管プロトコールにおいて声門の確認に１０秒以上要する場合は挿管を断念するか一旦ＣＰＲに戻り、もう１回だけ再施行する。"},{"no":182,"text":"【プロトコール】気管挿管実施後の上腹部聴診と胸壁の動き観察がともに問題なければ５点聴診を実施する。"},{"no":183,"text":"【プロトコール】気管挿管実施後の５点聴診で呼吸音の確認で確信がもてない場合は喉頭鏡で展開し、声門を通過しているか確認する。"},{"no":184,"text":"【プロトコール】気管挿管を実施し気管チューブ固定後の器具による確認単独では１００％正確ではないので他の所見と合わせて総合的に判断する。"},{"no":185,"text":"【プロトコール】気管挿管を実施し気管チューブ固定後の位置確認器具として連続的呼気終末二酸化炭素（ETCO2）モニターがあり、呼気時に波形が出現することを確認する。"},{"no":186,"text":"【プロトコール】気管挿管プロトコールにおける喉頭展開と気管挿管の試行は、原則として合計で最大２回までとする。"},{"no":187,"text":"【プロトコール】気管挿管プロトコールにおいて、気管挿管を１回目に失敗した場合は、再施行の前に３０秒間ＣＰＲを行う。"},{"no":188,"text":"【プロトコール】気管挿管を再施行する場合は、１回目の失敗原因を考え、スニッフィングポジションの修正やスタイレットの曲がりを工夫する。"},{"no":189,"text":"【プロトコール】気管挿管の適応除外例には、「適応除外例」と「気管挿管を実施する必要はない事例」がある。"},{"no":190,"text":"【プロトコール】気管挿管の適応除外例として、状況から頸髄損傷が強く疑われる事例がある。"},{"no":191,"text":"【プロトコール】気管挿管の適応除外例として、頭部後屈困難例がある。"},{"no":192,"text":"【プロトコール】気管挿管の適応除外例として、開口困難と考えられる例がある。"},{"no":193,"text":"【プロトコール】気管挿管の適応除外例として、喉頭鏡挿入困難例がある。"},{"no":194,"text":"【プロトコール】気管挿管の適応除外例として、喉頭鏡挿入後喉頭展開困難例がある。"},{"no":195,"text":"【プロトコール】気管挿管の適応除外例として、その他の理由で声門確認困難例がある。"},{"no":196,"text":"【プロトコール】気管挿管の適応除外例として、時間を要する、もしくは要すると考えられる例がある。"},{"no":197,"text":"【プロトコール】気管挿管の適応除外例として、その他担当救急救命士が気管挿管不適当と考えた例がある。"},{"no":198,"text":"【プロトコール】気管挿管を実施する必要はない事例として、脳血管障害による心肺停止が明らかな事例がある。"},{"no":199,"text":"【プロトコール】気管挿管を実施する必要はない事例として、心筋梗塞、致死性不整脈など、循環器系の傷病に起因する心肺停止が明らかな事例がある。"},{"no":200,"text":"【プロトコール】気管挿管を実施する必要はない事例として、呼吸系を除く部位の外傷に起因する心肺停止が明らかな事例がある。"}]},"video":{"name":"ビデオ喉頭鏡試験","icon":"🎥","items":[{"no":1,"text":"軟口蓋に連なる弓状のヒダを口蓋舌弓と呼ぶ。"},{"no":2,"text":"披裂部とは、披裂軟骨や周囲の筋組織により構成される部位をいう。"},{"no":3,"text":"披裂部は声門と食道入口部を識別するため重要な指標となる。"},{"no":4,"text":"後部障害物には、上顎の歯・上顎が含まれる。"},{"no":5,"text":"開口して奥を覗くと正面に口蓋垂と、これに連なる口蓋弓が弓状の２つのヒダとしてみえる（口蓋舌弓と口蓋咽頭弓）"},{"no":6,"text":"気道は鼻腔から喉頭までの上気道と気管から抹梢の下気道に区分される。"},{"no":7,"text":"喉頭部分の長さは成人で３～４㎝である。"},{"no":8,"text":"気管・気管支は筒型であり、前部と側部はＵ型の軟骨で形成されている。"},{"no":9,"text":"気管・気管支の後部は軟骨がなく膜様部（膜性壁）と呼ばれ、食道の前壁と接している。"},{"no":10,"text":"口腔の上壁の前方約２/３は骨性部の硬口蓋、後方約１/３は筋性部の軟口蓋である。"},{"no":11,"text":"気管は後方からの圧迫に弱く脊椎損傷などで血腫ができると気管膜様部を圧迫して窒息することがある。"},{"no":12,"text":"喉頭は第４・５・６頸椎の前方に位置している。"},{"no":13,"text":"喉頭は主に４種の軟骨(喉頭蓋軟骨、甲状軟骨、披裂軟骨、輪状軟骨)で形成される。"},{"no":14,"text":"咽頭後壁は口蓋垂、口蓋咽頭弓、左右の口蓋扁桃に囲まれた奥に位置する。"},{"no":15,"text":"切歯から喉頭までの距離は成人１２～１３㎝である。"},{"no":16,"text":"気管は第６頸椎の高さからはじまり、およそ第４～６胸椎の高さで左右の気管支に分かれる。"},{"no":17,"text":"右主気管支は左に比べて太く短く（約２㎝）、正中線に対する角度が小さい（２０～２５°）"},{"no":18,"text":"左主気管支は右よりも細く、長く（約５㎝）、正中線に対して４０～４５°の傾斜である。"},{"no":19,"text":"切歯から気管分岐部までの距離は成人男性で約２５㎝、女性で約２３㎝である。"},{"no":20,"text":"イントロックには、吸引カテーテル挿入口とスコープ挿入口があるものがある。"},{"no":21,"text":"ビデオ喉頭鏡は開口制限があるとイントロックが挿入できない。"},{"no":22,"text":"気管内チューブはガイド溝に沿って挿入する。"},{"no":23,"text":"イントロックの吸引カテーテル挿入孔の径では12Frのサイズのカテーテルまでが使用可能である。"},{"no":24,"text":"イントロックの吸引カテーテル挿入口から吸引する際は、モニタ画面で確認しながら吸引を行う。"},{"no":25,"text":"ビデオ喉頭鏡は、電池消耗警告アイコンが表示されても、すぐに電源が切れることはない。"},{"no":26,"text":"ビデオ喉頭鏡の電源が入っているときに電源ボタンを押すとターゲットマーク表示/非表示の切換えができる。"},{"no":27,"text":"ビデオ喉頭鏡による気管挿管では、スタイレットを使用しない。"},{"no":28,"text":"気管内チューブをイントロックに装着する際は、気管内チューブの先端がモニター画面の右側にわずかに確認出来る程度の位置までチューブを進め固定する。"},{"no":29,"text":"ビデオ喉頭鏡を保持する時は、イントロックを握らないように本体中央部を保持する。"},{"no":30,"text":"イントロックのガイド溝に沿って気管チューブを進めると前方（上方）方向にチューブ先端が誘導される。"},{"no":31,"text":"ビデオ喉頭鏡の場合、イントロックを喉頭蓋の下側へ滑り込ませ、喉頭蓋を持ち上げる。"},{"no":32,"text":"イントロックの喉頭展開板を直接目視し、口腔正中からイントロックの彎曲に沿って挿入する。"},{"no":33,"text":"イントロックの挿入状態を確認しながら、本体が正中に位置するよう調整する。"},{"no":34,"text":"気管チューブの先端が右披裂部にあたる場合、イントロックの先端位置が声門部に近すぎることがある。"},{"no":35,"text":"首の長い成人では、相対的にイントロックの長さそのものが短い可能性がある。その場合、頭頸部を軽度前屈すると喉頭蓋までの距離が短くなり、喉頭蓋を持ち上げることができる。"},{"no":36,"text":"胸骨圧迫をやむを得ず中断する場合は（１０秒以内）にとどめる。"},{"no":37,"text":"開口困難及びビデオ喉頭鏡挿入困難な症例と考えれば適応外である。"},{"no":38,"text":"ビデオ喉頭鏡において、声門が確認できなければ、適応とはならない。"},{"no":39,"text":"「心臓機能あり・呼吸機能停止」の傷病者はビデオ喉頭鏡を用いて気管挿管できない。"},{"no":40,"text":"ビデオ喉頭鏡において声門部がすべて見えていたため、気管挿管を実施した。"},{"no":41,"text":"ビデオ喉頭鏡挿入後は、ビデオ喉頭鏡の画面を通して声門部全体を視認でき、かつ、チューブが挿入できる適正な位置に（呼吸音の確認操作が終わるまで）ビデオ喉頭鏡を固定する。"},{"no":42,"text":"胸壁の挙上とは、換気に伴って傷病者の前胸壁全体が均等に持ち上がる状態をいう。"},{"no":43,"text":"ビデオ喉頭鏡による気管挿管時、全体を通じて可能な限り中断しない。"},{"no":44,"text":"ビデオ喉頭鏡の操作においては「こねる」という動作が必要である。"},{"no":45,"text":"気管内チューブに潤滑ゼリーを塗布してから、ガイド溝に沿って滑らせるように気管内チューブを差し込む。"},{"no":46,"text":"ビデオ喉頭鏡による気管挿管の適応は１５歳以上である。"},{"no":47,"text":"ビデオ喉頭鏡による気管挿管では位置確認器具（呼気二酸化炭素モニター）による確認が省略できない。"},{"no":48,"text":"ビデオ喉頭鏡による気管挿管で再施行する場合には、従来型喉頭鏡を用いた気管挿管も考慮する。"},{"no":49,"text":"ビデオ喉頭鏡での気管挿管はスニッフィングポジションをとる必要はない。"},{"no":50,"text":"口腔内に吐物等が認められる場合は吸引を行い視野を確保する。"},{"no":51,"text":"ビデオ喉頭鏡の挿入時にイントロックで舌を圧排したり、上顎歯を圧迫しないようにする。"},{"no":52,"text":"声門部を視認した状態で、ビデオ喉頭鏡のターゲットマークが声門部と一致するようにイントロックの位置を調節する。"},{"no":53,"text":"モニターを視認しながらカフエアを注入してＢＶＭ換気を行う。"},{"no":54,"text":"モニターを視認しながら胸壁の拳上および呼吸音を確認する。"},{"no":55,"text":"呼吸音の確認では、５点聴診を行う。"},{"no":56,"text":"ビデオ喉頭鏡での気管挿管位置確認器具として連続的呼気終末二酸化炭素（ＥＴＣＯ２）モニターにより、呼気時に波形が出現することを確認する。"},{"no":57,"text":"ビデオ喉頭鏡での気管挿管では、全体を通じて胸骨圧迫は可能な限り中断しない。やむを得ず中断する場合も、喉頭部視認やチューブ挿入の前後、チューブ位置確認等短時間（１０秒以内）にとどめる。"},{"no":58,"text":"ビデオ喉頭鏡での気管挿管の適応は、１５歳以上で目撃の無い心静止以外でかつ声門上気道デバイスで換気不良と予測される場合である。"},{"no":59,"text":"ビデオ喉頭鏡による気管挿管はイントロックの湾曲に沿って舌を圧排させず挿入する。"},{"no":60,"text":"ビデオ喉頭鏡による気管挿管時、必ず複数の者の目でビデオ喉頭鏡モニターによりチューブが声門部を通過していることを確認する。"},{"no":61,"text":"声門の確認とは、声門全体が確認でき、ビデオ喉頭鏡のモニターのターゲットマークが声門部にLock-onした状態をいう。"},{"no":62,"text":"声門の確認に３０秒以上かかる場合は断念するか、ＣＰＲにいったん戻り、もう１回だけ再施行する。"},{"no":63,"text":"気管挿管を再施行する場合は、失敗の原因を考え、口腔内吸引の再実施、ビデオ喉頭鏡の挿入方法と深さの調節、ＢＵＲＰ法、甲状軟骨圧迫法などを実施する。"},{"no":64,"text":"気管挿管を再施行する場合は、従来型喉頭鏡を用いた気管挿管も考慮し原則として合計で最大２回までとする。"},{"no":65,"text":"イントロック(型式ＳＬ)は、対応気管チューブサイズは外径８．５～１１mmである。"},{"no":66,"text":"薄型イントロック(型式ＴＬ)は、対応気管チューブサイズは外径７．５～１０mmである。"},{"no":67,"text":"ビデオ喉頭鏡救命士である場合は、ビデオ喉頭鏡を第一選択とするが、傷病者の状況等により適切に選択する。"},{"no":68,"text":"ビデオ喉頭鏡での気管挿管時、気管内チューブガイド溝から気管チューブを外す際は右口角で気管内チューブを確実に保持する。"},{"no":69,"text":"気管内チューブが間違いなく気管内に留置されている判断の基本は、視診や聴診という身体所見の観察にあるがそれだけでは判断を誤ることがある。"},{"no":70,"text":"気管内チューブが正しい位置に留置され、適切な換気が行われているか否かは、胸郭や腹部の動き、左右の呼吸音、バッグを加圧する手の感触、カプノメーターに表示される波形もしくは数値などを継続的に観察し、総合的に評価する必要がある。"}]}};
let selected='drug', countChoice='all', session=null, current=null;
const $=id=>document.getElementById(id);function show(id){['home','setup','quiz','finish'].forEach(x=>$(x).classList.toggle('hidden',x!==id))}function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function allItems(key){if(key!=='all')return DB[key].items.map(x=>({...x,exam:key}));return Object.keys(DB).flatMap(k=>DB[k].items.map(x=>({...x,exam:k})))}function examName(k){return DB[k].name}function init(){let g=$('examGrid');Object.entries(DB).forEach(([k,v])=>{let b=document.createElement('button');b.className='exam';b.innerHTML=`<div style="font-size:30px">${v.icon}</div><b>${v.name}</b><span>${v.items.length}問</span>`;b.onclick=()=>selectExam(k);g.appendChild(b)});document.querySelectorAll('.countBtn').forEach(b=>b.onclick=()=>{countChoice=b.dataset.n;document.querySelectorAll('.countBtn').forEach(x=>x.style.outline='');b.style.outline='3px solid #9aacee'});document.querySelector('.countBtn[data-n="all"]').click()}
function selectExam(k){selected=k;$('setupTitle').textContent=examName(k);$('setupCount').textContent=`収録：${allItems(k).length}問`;let saved=loadSession(k);if(saved&&saved.index<saved.order.length){$('resumeCard').classList.remove('hidden');$('resumeText').textContent=`${saved.index}/${saved.order.length}問まで回答済み（${saved.mode==='mix'?'MIX':saved.mode==='ox'?'○×':'4択穴埋め'}）`;}else $('resumeCard').classList.add('hidden');show('setup')}
function storageOK(){try{localStorage.setItem('_t','1');localStorage.removeItem('_t');return true}catch(e){return false}}function saveSession(){if(!storageOK()||!session)return;localStorage.setItem('seibun_v4_'+selected,JSON.stringify(session))}function loadSession(k){if(!storageOK())return null;try{return JSON.parse(localStorage.getItem('seibun_v4_'+k)||'null')}catch(e){return null}}function clearSession(){if(storageOK())localStorage.removeItem('seibun_v4_'+selected);$('resumeCard').classList.add('hidden')}
function startSession(mode){let items=allItems(selected), n=countChoice==='all'?items.length:Math.min(+countChoice,items.length), order=shuffle(items.map((_,i)=>i)).slice(0,n);session={mode,order,index:0,correct:0,wrong:0,items,selected};saveSession();show('quiz');renderQuestion()}function resumeSession(){session=loadSession(selected);if(!session)return;show('quiz');renderQuestion()}function quitQuiz(){saveSession();selectExam(selected)}function goHome(){session=null;show('home')}
const numRe=/[０-９0-9]+(?:[\.．][０-９0-9]+)?(?:～[０-９0-9]+)?/g;
const termPairs=[['静脈','動脈'],['末梢','中枢'],['成人','小児'],['上昇','低下'],['増加','減少'],['右','左'],['陽性','陰性'],['必要','不要'],['適応','禁忌'],['収縮期','拡張期'],['吸気','呼気'],['気管','食道'],['声門','喉頭蓋'],['近位','遠位'],['前方','後方']];
function toAsciiNum(raw){return raw.replace(/[０-９．]/g,ch=>ch==='．'?'.':String.fromCharCode(ch.charCodeAt(0)-0xFEE0))}
function numLike(raw,val){let rep=String(val);if(/[０-９]/.test(raw))rep=rep.replace(/[0-9]/g,ch=>String.fromCharCode(ch.charCodeAt(0)+0xFEE0)).replace('.', '．');return rep}
function numericAlternatives(raw){let v=parseFloat(toAsciiNum(raw));if(isNaN(v))return[];let pool=[];let add=x=>{if(x>=0&&x!==v&&!pool.includes(x))pool.push(x)};if(v===0){[1,2,5,10].forEach(add)}else if(v<5){[v+1,v+2,Math.max(0,v-1),v*2].forEach(add)}else if(v<20){[v+1,v+5,Math.max(0,v-2),Math.round(v*1.5)].forEach(add)}else{[v+5,v+10,Math.max(0,v-5),Math.round(v*1.25),Math.round(v*1.5)].forEach(add)}return shuffle(pool).map(x=>numLike(raw,x))}
function alterationCandidates(text){let out=[];for(let m of text.matchAll(numRe)){let alts=numericAlternatives(m[0]);alts.slice(0,4).forEach(rep=>out.push({text:text.slice(0,m.index)+rep+text.slice(m.index+m[0].length),wrong:rep,right:m[0],pos:m.index}))}for(let [a,b] of termPairs){let from=0;while((from=text.indexOf(a,from))>=0){out.push({text:text.slice(0,from)+b+text.slice(from+a.length),wrong:b,right:a,pos:from});from+=a.length}from=0;while((from=text.indexOf(b,from))>=0){out.push({text:text.slice(0,from)+a+text.slice(from+b.length),wrong:a,right:b,pos:from});from+=b.length}}return out}
function alterText(text){let c=alterationCandidates(text);return c.length?c[Math.floor(Math.random()*c.length)]:null}
function protectedMedicalSpan(text,start,end){
  // Do not split numbers that are part of medical abbreviations such as ETCO2, SpO2, PaCO2, PaO2, FiO2.
  const left=text.slice(Math.max(0,start-12),start), right=text.slice(end,end+12);
  if(/[A-Za-z][A-Za-z0-9]*$/i.test(left) || /^[A-Za-z]/i.test(right)) return true;
  return false;
}
function expandClinicalNumber(text,start,end){
  // Keep clinically meaningful number + unit expressions together (e.g. 30回/分, 90秒以内, 1mg, 0.01mg/kg, 95％, 100mmHg).
  const tail=text.slice(end);
  const unit=tail.match(/^(?:\s*)(?:mg(?:\\/kg)?|μg(?:\\/kg)?|mcg(?:\\/kg)?|g|kg|mL|ml|L|mmHg|cmH2O|回\\/分|回\/分|回|秒(?:以内|以上|以下)?|分(?:以内|以上|以下)?|時間(?:以内|以上|以下)?|％|%|℃|歳(?:以上|以下)?)/i);
  if(unit) end+=unit[0].length;
  return {start,end,token:text.slice(start,end)};
}
function blankCandidates(text){let out=[];for(let m of text.matchAll(numRe)){let start=m.index,end=m.index+m[0].length;if(protectedMedicalSpan(text,start,end))continue;let span=expandClinicalNumber(text,start,end), ans=span.token;let opts=numericAlternatives(m[0]);if(opts.length>=3){let suffix=ans.slice(m[0].length);let choices=[ans,...opts.slice(0,3).map(x=>x+suffix)];out.push({q:text.slice(0,span.start)+'［　］'+text.slice(span.end),ans,opts:shuffle(choices),highlight:ans,pos:span.start})}}for(let [a,b] of termPairs){let from=0;while((from=text.indexOf(a,from))>=0){let distract=shuffle([b,'該当なし','その他']);out.push({q:text.slice(0,from)+'［　］'+text.slice(from+a.length),ans:a,opts:shuffle([a,...distract.slice(0,3)]),highlight:a,pos:from});from+=a.length}from=0;while((from=text.indexOf(b,from))>=0){let distract=shuffle([a,'該当なし','その他']);out.push({q:text.slice(0,from)+'［　］'+text.slice(from+b.length),ans:b,opts:shuffle([b,...distract.slice(0,3)]),highlight:b,pos:from});from+=b.length}}return out}
function genericBlankData(text){
  const stop=new Set(['場合','こと','ため','もの','これら','それぞれ','傷病者','患者','必要','実施','確認','行う','認める','できる','される','による','における']);
  let ms=[...text.matchAll(/[一-龠々ァ-ヶー]{2,12}/g)].filter(m=>!stop.has(m[0]));
  if(!ms.length) ms=[...text.matchAll(/[A-Za-z]{2,10}[0-9]{0,2}/g)];
  if(!ms.length) return {q:'［　］',ans:text,opts:shuffle([text,'該当なし','その他','判断できない']),highlight:text,pos:0};
  let m=ms[Math.floor(Math.random()*ms.length)], ans=m[0];
  let pool=[];
  if(session&&session.items){for(let it of session.items){for(let x of it.text.matchAll(/[一-龠々ァ-ヶー]{2,12}/g)){let t=x[0];if(t!==ans&&!stop.has(t)&&Math.abs(t.length-ans.length)<=4&&!pool.includes(t))pool.push(t);if(pool.length>80)break}if(pool.length>80)break}}
  let distract=shuffle(pool).slice(0,3);for(let x of ['該当なし','その他','判断できない']){if(distract.length>=3)break;if(x!==ans&&!distract.includes(x))distract.push(x)}
  return {q:text.slice(0,m.index)+'［　］'+text.slice(m.index+ans.length),ans,opts:shuffle([ans,...distract.slice(0,3)]),highlight:ans,pos:m.index};
}
function blankData(text){let c=blankCandidates(text);return c.length?c[Math.floor(Math.random()*c.length)]:genericBlankData(text)}
function renderQuestion(){if(session.index>=session.order.length)return finish();let item=session.items[session.order[session.index]], mode=session.mode==='mix'?(Math.random()<.5?'ox':'blank'):session.mode;let bd=mode==='blank'?blankData(item.text):null;current={item,mode};$('counter').textContent=`${session.index+1} / ${session.order.length}`;$('bar').style.width=`${session.index/session.order.length*100}%`;$('result').classList.add('hidden');$('nextBtn').classList.add('hidden');$('oxWrap').classList.toggle('hidden',mode!=='ox');$('choices').classList.toggle('hidden',mode!=='blank');$('choices').innerHTML='';if(mode==='ox'){let alt=alterText(item.text), isTrue=!alt||Math.random()<.5;current.correct=isTrue;current.alt=isTrue?null:alt;$('modeLabel').textContent=`⭕❌ ○× ・ ${DB[item.exam].name} No.${item.no}`;$('question').textContent=isTrue?item.text:alt.text}else{current.blank=bd;current.correct=bd.ans;$('modeLabel').textContent=`🔲 4択 ・ ${DB[item.exam].name} No.${item.no}`;$('question').textContent=bd.q;bd.opts.forEach(o=>{let b=document.createElement('button');b.className='choice';b.textContent=o;b.onclick=()=>answerBlank(o,b);$('choices').appendChild(b)})}updateStats()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function highlighted(text,needle){if(!needle)return esc(text);let i=text.indexOf(needle);if(i<0)return esc(text);return esc(text.slice(0,i))+`<span class="hl">${esc(needle)}</span>`+esc(text.slice(i+needle.length))}
function record(ok){if(ok)session.correct++;else session.wrong++;session.index++;saveSession();updateStats();$('nextBtn').classList.remove('hidden')}
function answerOX(v){if($('nextBtn').classList.contains('hidden')===false)return;let ok=v===current.correct;let msg=ok?'正解！':'不正解';let detail=current.alt?`<div class="tiny" style="margin-top:6px">変更されていた箇所：<b>${esc(current.alt.wrong)}</b> → <b>${esc(current.alt.right)}</b></div>`:'';$('result').innerHTML=`<strong>${ok?'✅':'❌'} ${msg}</strong>${detail}<div class="master"><span class="tiny">正しい正文</span><br>${highlighted(current.item.text,current.alt?current.alt.right:null)}</div>`;$('result').classList.remove('hidden');record(ok)}
function answerBlank(val,btn){if(!$('nextBtn').classList.contains('hidden'))return;let ok=val===current.blank.ans;[...$('choices').children].forEach(b=>{b.disabled=true;if(b.textContent===current.blank.ans)b.classList.add('correct')});if(!ok)btn.classList.add('wrong');$('result').innerHTML=`<strong>${ok?'✅ 正解！':'❌ 不正解'}</strong><div class="master"><span class="tiny">正しい正文</span><br>${highlighted(current.item.text,current.blank.highlight)}</div>`;$('result').classList.remove('hidden');record(ok)}
function updateStats(){if(!session)return;$('sCorrect').textContent=session.correct;$('sWrong').textContent=session.wrong;let n=session.correct+session.wrong;$('sRate').textContent=n?Math.round(session.correct/n*100)+'%':'—'}function nextQuestion(){renderQuestion()}function finish(){let n=session.correct+session.wrong,r=n?Math.round(session.correct/n*100):0;$('finishText').textContent=`${examName(selected)}を ${session.order.length}問、重複なしで完走しました。`;$('fCorrect').textContent=session.correct;$('fWrong').textContent=session.wrong;$('fRate').textContent=r+'%';clearSession();show('finish')}function restartSame(){let m=session.mode;startSession(m)}init();</script><script>if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));}</script></body></html>
